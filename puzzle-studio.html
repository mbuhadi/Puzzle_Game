<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tileset_picker.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Same palette as Map Studio's default (Desert Gold) theme */
:root {
  --gold:     #c8a84b;
  --gold-dim: #7a6030;
  --bg:       #0e0d0a;
  --bg2:      #14120e;
  --bg3:      #1e1a12;
  --border:   #2e2a1e;
  --text:     #d4ba88;
  --dim:      #6a5c3a;
  --hover:    #231d0e;
  --check1:   #171512;
  --check2:   #1d1a15;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Cinzel', serif; }

#app { display: flex; flex-direction: column; height: 100%; }

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar {
  height: 42px; flex-shrink: 0;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px; padding: 0 10px;
}
#puzzleLabel { font-size: 12px; color: var(--text); letter-spacing: 1px; margin-right: 8px; white-space: nowrap; }
#saveFlash { font-family: monospace; font-size: 10px; margin-left: 6px; white-space: nowrap; }
.tb-title {
  font-family: 'Cinzel Decorative', serif; font-size: 12px;
  color: var(--gold); letter-spacing: 2px; margin-right: 10px; white-space: nowrap;
}

button {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.5px;
  padding: 5px 11px; border-radius: 3px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--gold-dim); color: var(--gold); }
button.active { border-color: var(--gold); color: var(--gold); }
button:disabled { opacity: 0.35; cursor: default; }
button:disabled:hover { border-color: var(--border); color: var(--text); }
.hint-text { font-family: sans-serif; font-size: 10px; color: var(--dim); line-height: 1.5; letter-spacing: 0; }

/* ── Screen tabs: the Problem plus its Givens (styled like Map Studio's rooms) */
#screenTabs {
  height: 32px; flex-shrink: 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; gap: 3px; padding: 4px 8px 0 8px;
  overflow-x: auto; overflow-y: hidden;
}
#screenTabs::-webkit-scrollbar { height: 3px; }
#screenTabs::-webkit-scrollbar-thumb { background: var(--border); }
.screen-tab {
  display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  padding: 5px 8px 5px 12px;
  background: var(--bg2); border: 1px solid var(--border); border-bottom: none;
  border-radius: 6px 6px 0 0; cursor: pointer;
  font-size: 11px; letter-spacing: 0.5px; color: var(--dim);
  user-select: none; white-space: nowrap;
}
.screen-tab:hover { color: var(--text); }
.screen-tab.active { background: var(--bg3); border-color: var(--gold-dim); color: var(--gold); }
.screen-tab.problem { padding-right: 12px; }
.tab-x { font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 2px; color: var(--dim); }
.tab-x:hover { color: #cc7070; }
#addGivenBtn {
  flex-shrink: 0; align-self: center; margin-left: 4px;
  font-size: 10px; padding: 3px 9px;
}

/* ── Main: sidebar + board ────────────────────────────────────────────────── */
#main { flex: 1; display: flex; min-height: 0; }
#sidebar {
  width: 210px; flex-shrink: 0; overflow-y: auto;
  background: var(--bg2); border-right: 1px solid var(--border); padding: 12px;
}
.sec-title { font-size: 9px; letter-spacing: 2.5px; color: var(--dim); margin-bottom: 8px; }

#stageWrap {
  flex: 1; min-width: 0; position: relative; overflow: hidden;
  background: repeating-conic-gradient(var(--check1) 0% 25%, var(--check2) 0% 50%) 0 0 / 32px 32px;
}
/* A puzzle "screen" — safe area + bleed (see the script), scaled to fit the
   space. One per tab (the Problem and each Given); only the active tab's
   board is shown. */
.board {
  position: absolute; left: 0; top: 0;   /* width/height = the puzzle window, set in JS */
  transform-origin: 0 0; background: #080705;
  border: 1px solid var(--gold-dim); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  touch-action: none; overflow: hidden;
}
.board:not(.active) { display: none; }
.sprite {
  position: absolute; image-rendering: pixelated; cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.sprite.dragging { cursor: grabbing; }
.sprite.selected { outline: 2px solid var(--gold); outline-offset: 1px; }
.guides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.guide-safe, .guide-device { position: absolute; }
.guide-safe { border: 2px dashed rgba(200,168,75,0.8); }
.guide-device { border: 1px solid rgba(160,190,220,0.35); }
.guide-safe span, .guide-device span {
  position: absolute; left: 6px; top: 4px; font-family: monospace; font-size: 14px;
  letter-spacing: 1px; color: rgba(200,168,75,0.8); white-space: nowrap;
}
.guide-device span { color: rgba(160,190,220,0.55); font-size: 12px; }
.marquee {
  position: absolute; pointer-events: none; z-index: 10;
  border: 2px dashed var(--gold); background: rgba(200,168,75,0.12);
}

/* ── Long-press menu (touch: copy / paste / delete) ───────────────────────── */
.sel-menu {
  position: fixed; z-index: 600; display: none; flex-direction: column;
  min-width: 120px; background: var(--bg2); border: 1px solid var(--gold-dim);
  border-radius: 6px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.55);
}
.sel-menu.open { display: flex; }
.sel-menu button {
  background: none; border: none; border-radius: 0; text-align: left; padding: 11px 18px;
  font-size: 12px; color: var(--text);
}
.sel-menu button:hover, .sel-menu button:active { color: var(--gold); background: var(--bg3); }
.sel-menu button:disabled { opacity: 0.35; color: var(--text); background: none; }
.sel-menu-sep { height: 1px; background: var(--border); }

/* ── Load panel ───────────────────────────────────────────────────────────── */
#loadBox { width: 420px; max-height: 80vh; }
#loadList { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.load-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 4px; background: var(--bg3);
}
.load-item .ln { flex: 1; font-size: 12px; color: var(--text); }
.load-item .ld { font-family: sans-serif; font-size: 10px; color: var(--dim); }

#statusbar {
  height: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
  padding: 0 10px; background: var(--bg2); border-top: 1px solid var(--border);
  font-family: monospace; font-size: 10px; color: var(--dim);
}

/* ── Overlay dialogs (the tileset picker) ─────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82);
  z-index: 500; display: none; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.overlay-box {
  display: flex; flex-direction: column; max-width: 94vw;
  background: var(--bg2); border: 1px solid var(--gold-dim);
  border-radius: 6px; overflow: hidden;
}
.overlay-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
  flex-wrap: wrap;
}

@media (max-width: 700px) {
  #sidebar { width: 150px; padding: 8px; }
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="tb-title">PUZZLE STUDIO</span>
    <span id="puzzleLabel"></span>
    <button onclick="openLoadPanel()" title="Open a puzzle saved from Puzzle Studio to keep editing it">Load</button>
    <button id="saveBtn" onclick="savePuzzle()" title="Save this puzzle to the Puzzle Guide (commits it to the website's GitHub repo)">Save</button>
    <span id="saveFlash"></span>
  </div>

  <div id="screenTabs">
    <!-- tabs injected by renderTabs() -->
    <button id="addGivenBtn" onclick="addGiven()" title="Add a given to this puzzle — it opens in its own tab">+ Given</button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="sec-title">OBJECTS</div>
      <button onclick="openTileset()" style="width:100%" title="Pick a sprite from the tilesets — it lands on the board, then drag it into place">Browse Tileset…</button>
    </div>
    <div id="stageWrap"></div>
  </div>

  <div id="statusbar">
    <span id="stScreen">Problem</span>
    <span id="stCount">0 objects</span>
    <span id="stBoard" title="Everything inside the safe area shows on every screen; the board around it is extra that wide or tall screens also show"></span>
    <span id="stSel" style="color:var(--gold)"></span>
    <span>drag on empty space to select · drag selected things to move · long-press or right-click: copy / paste / delete · Delete key removes</span>
  </div>

  <!-- Long-press menu -->
  <div id="selMenu" class="sel-menu">
    <button id="selMenuCopy" type="button">Copy</button>
    <div class="sel-menu-sep"></div>
    <button id="selMenuPaste" type="button">Paste</button>
    <div class="sel-menu-sep"></div>
    <button id="selMenuDelete" type="button">Delete</button>
  </div>

  <!-- Load panel -->
  <div id="loadOverlay" class="overlay">
    <div id="loadBox" class="overlay-box">
      <div class="overlay-head">LOAD A PUZZLE STUDIO PUZZLE<button style="margin-left:auto" onclick="closeLoadPanel()">Close</button></div>
      <div id="loadList"></div>
    </div>
  </div>

</div>

<script src="puzzles_studio.js"></script>
<script src="puzzles_curated_data.js"></script>
<script src="assets/anim_manifest.js"></script>
<script src="assets/tileset_picker.js"></script>
<script>
// ── Puzzle Studio ─────────────────────────────────────────────────────────────
// A puzzle is its Problem screen plus any number of Given screens, each a
// board (safe area + bleed, see below) in its own tab. Boards are filled from the shared Browse
// Tileset picker (assets/tileset_picker.js): each pick becomes a sprite on
// the active tab's board (drawn at 4× — one 16px tile = 64 board px — or
// shrunk to fit if it's a big picture). Sprites are selected, moved, copied,
// pasted and deleted like objects in Map Studio.
const PX = 4;

// Every screen shape, the way commercial games do it: a SAFE area that every
// screen shows in full, centered in a bigger board whose BLEED is shown or
// cropped depending on the screen. In the game the board is scaled so the
// safe area just fits the puzzle window; a wide phone then also shows bleed
// at the left/right, a squarer tablet at the top/bottom.
//   safe  1280×720 (16:9)  — put everything the player needs in here
//   board 1728×960         — 1728 = 720 × 2.4 (21:9 phones), 960 = 1280 ÷ 4:3
//                            (iPads), so no landscape screen from 4:3 to 21:9
//                            ever shows past the board's edge
const SAFE_W = 1280, SAFE_H = 720;
let BOARD_W = 1728, BOARD_H = 960;
let safeW = SAFE_W, safeH = SAFE_H;   // a loaded older puzzle may differ

// What a screen of aspect `a` (the puzzle window's width ÷ height) shows
const DEVICE_GUIDES = [
  { a: 4 / 3,   label: '4:3 tablet' },
  { a: 16 / 10, label: '16:10 tablet' },
  { a: 20 / 9,  label: '20:9 phone' },
];
function visibleRect(a) {
  const w = a >= safeW / safeH ? safeH * a : safeW;
  const h = a >= safeW / safeH ? safeH : safeW / a;
  return { x: (BOARD_W - w) / 2, y: (BOARD_H - h) / 2, w, h };
}
const stageWrap = document.getElementById('stageWrap');
let boardScale = 1;

// ── Screens (tabs) ────────────────────────────────────────────────────────────
const screens = [];   // {kind: 'problem'|'given', board: <div>, sprites: [{el, pick, x, y, w, h}]}
let cur = 0;          // index of the active tab
function curScreen() { return screens[cur]; }

// A new puzzle continues the Puzzle Guide's numbering: one past the highest
// puzzle number there (hand-made or saved from here). Load switches it to the
// loaded puzzle's number, so Save then updates that puzzle.
let puzzleNum = Math.max(0, ...PUZZLES.map(p => +p.num || 0)) + 1;
let editingSaved = false;
function updatePuzzleLabel() {
  document.getElementById('puzzleLabel').textContent =
    'Puzzle ' + puzzleNum + (editingSaved ? ' (editing)' : '');
  document.title = 'Puzzle Studio — Puzzle ' + puzzleNum;
}
updatePuzzleLabel();

// Chunk labels match the Puzzle Guide's: p9p1 = problem, p9g1… = givens
function screenLabel(i) {
  return screens[i].kind === 'problem' ? `p${puzzleNum}p1` : `p${puzzleNum}g${i}`;   // givens follow the problem
}
function screenName(i) {
  return (screens[i].kind === 'problem' ? 'Problem' : 'Given ' + i) + ' · ' + screenLabel(i);
}

function makeScreen(kind) {
  const board = document.createElement('div');
  board.className = 'board';
  board.style.width  = BOARD_W + 'px';
  board.style.height = BOARD_H + 'px';
  board.appendChild(makeGuides());
  stageWrap.appendChild(board);
  const sc = { kind, board, sprites: [] };
  screens.push(sc);
  wireBoard(sc);
  fitBoard();
  return sc;
}

// Safe-area outline + what each kind of screen shows (non-interactive overlay)
function makeGuides() {
  const g = document.createElement('div');
  g.className = 'guides';
  const box = (r, cls, label) => {
    const el = document.createElement('div');
    el.className = cls;
    Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    if (label) { const t = document.createElement('span'); t.textContent = label; el.appendChild(t); }
    g.appendChild(el);
  };
  if (BOARD_W > safeW || BOARD_H > safeH)
    for (const d of DEVICE_GUIDES) box(visibleRect(d.a), 'guide-device', d.label);
  box({ x: (BOARD_W - safeW) / 2, y: (BOARD_H - safeH) / 2, w: safeW, h: safeH },
      'guide-safe', 'SAFE AREA — visible on every screen');
  return g;
}

function switchScreen(i) {
  if (i !== cur) clearSelection();
  cur = i;
  screens.forEach((sc, j) => sc.board.classList.toggle('active', j === i));
  renderTabs();
  updateStatus();
}

function addGiven() {
  makeScreen('given');
  switchScreen(screens.length - 1);
}

function deleteGiven(i) {
  const sc = screens[i];
  if (sc.kind !== 'given') return;
  if (sc.sprites.length &&
      !confirm(`Delete ${screenName(i)} and the ${sc.sprites.length} object(s) on it?`)) return;
  if (i === cur) clearSelection();
  sc.board.remove();
  screens.splice(i, 1);
  switchScreen(cur === i ? i - 1 : cur > i ? cur - 1 : cur);
}

function renderTabs() {
  const bar = document.getElementById('screenTabs');
  bar.querySelectorAll('.screen-tab').forEach(t => t.remove());
  const addBtn = document.getElementById('addGivenBtn');
  screens.forEach((sc, i) => {
    const tab = document.createElement('div');
    tab.className = 'screen-tab' + (i === cur ? ' active' : '') + (sc.kind === 'problem' ? ' problem' : '');
    const nm = document.createElement('span');
    nm.textContent = screenName(i);
    tab.appendChild(nm);
    if (sc.kind === 'given') {
      const x = document.createElement('span');
      x.className = 'tab-x';
      x.textContent = '×';
      x.title = 'Delete this given';
      x.onclick = e => { e.stopPropagation(); deleteGiven(i); };
      tab.appendChild(x);
    }
    tab.onclick = () => switchScreen(i);
    bar.insertBefore(tab, addBtn);
  });
}

function updateStatus() {
  const n = curScreen().sprites.length;
  document.getElementById('stScreen').textContent = screenName(cur);
  document.getElementById('stCount').textContent = n + (n === 1 ? ' object' : ' objects');
  document.getElementById('stSel').textContent = selected.size ? selected.size + ' selected' : '';
  document.getElementById('stBoard').textContent = `safe ${safeW}×${safeH} · board ${BOARD_W}×${BOARD_H}`;
}

// Fit the boards inside the stage area, centered
function fitBoard() {
  const m = 16;
  const w = stageWrap.clientWidth - m * 2, h = stageWrap.clientHeight - m * 2;
  boardScale = Math.max(0.1, Math.min(w / BOARD_W, h / BOARD_H));
  const x = (stageWrap.clientWidth  - BOARD_W * boardScale) / 2;
  const y = (stageWrap.clientHeight - BOARD_H * boardScale) / 2;
  for (const sc of screens)
    sc.board.style.transform = `translate(${x}px, ${y}px) scale(${boardScale})`;
}
new ResizeObserver(fitBoard).observe(stageWrap);

// ── Sprites ───────────────────────────────────────────────────────────────────
function sourceOf(pick) {
  if (pick.kind === 'sheet') {
    const u = SHEET_TILE;
    return { img: sheetImg(pick.sheet), x: pick.sx * u, y: pick.sy * u,
             w: pick.sw * u, h: pick.sh * u, stride: 0, frames: 1, ms: 1000 };
  }
  if (pick.kind === 'anim') {
    const a = pick.anim;
    return { img: stripImg(a.src), x: a.x, y: a.y, w: a.w, h: a.h,
             stride: a.stride, frames: a.frames, ms: a.ms };
  }
  return { img: stripImg(pick.src), x: pick.x, y: pick.y, w: pick.w, h: pick.h,
           stride: 0, frames: 1, ms: 1000 };
}

const SHEET_IMGS = {};
function sheetImg(key) {
  if (!SHEET_IMGS[key]) { const im = new Image(); im.src = SHEETS[key].src; SHEET_IMGS[key] = im; }
  return SHEET_IMGS[key];
}

function drawSprite(s) {
  const src = sourceOf(s.pick), cv = s.el, g = cv.getContext('2d');
  const im = src.img;
  if (!(im.complete && im.naturalWidth)) {
    im.addEventListener('load', () => drawSprite(s), { once: true });
    return;
  }
  // Loop animations continuously (doors included) so the board shows movement
  const f = src.frames > 1 ? Math.floor(performance.now() / src.ms) % src.frames : 0;
  g.clearRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = false;
  g.drawImage(im, src.x + f * src.stride, src.y, src.w, src.h, 0, 0, cv.width, cv.height);
}

function placeSprite(s) {
  s.el.style.left = s.x + 'px';
  s.el.style.top  = s.y + 'px';
}

// Default on-board size: pixel art at 4×; anything big (an uploaded
// picture) shrunk to fit within 60% of the safe area instead of dwarfing it
function defaultSize(pick) {
  const src = sourceOf(pick);
  const k = Math.min(PX, safeW * 0.6 / src.w, safeH * 0.6 / src.h);
  return { w: Math.round(src.w * k), h: Math.round(src.h * k) };
}

const spriteOfEl = new WeakMap();
function addSprite(sc, pick, x, y, w, h) {
  const src = sourceOf(pick);
  const cv = document.createElement('canvas');
  cv.className = 'sprite';
  cv.width = src.w; cv.height = src.h;
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  const s = { el: cv, pick, x: Math.round(x), y: Math.round(y), w, h };
  spriteOfEl.set(cv, s);
  sc.sprites.push(s);
  sc.board.appendChild(cv);
  placeSprite(s);
  drawSprite(s);
  return s;
}

// Called by the picker's "Use Selection" — drop the pick in the center of
// the active tab's board, selected
function onTilesetUse(pick) {
  const { w, h } = defaultSize(pick);
  const s = addSprite(curScreen(), pick, (BOARD_W - w) / 2, (BOARD_H - h) / 2, w, h);
  selectOnly([s]);
}

// Animated picks keep playing on the visible board
setInterval(() => {
  for (const s of curScreen().sprites) if (sourceOf(s.pick).frames > 1) drawSprite(s);
}, 60);

// ── Selection ─────────────────────────────────────────────────────────────────
const selected = new Set();   // sprites of the active tab
function setSel(s, on) {
  if (on) selected.add(s); else selected.delete(s);
  s.el.classList.toggle('selected', on);
}
function clearSelection() {
  for (const s of [...selected]) setSel(s, false);
  updateStatusSafe();
}
function selectOnly(list) {
  for (const s of [...selected]) setSel(s, false);
  for (const s of list) setSel(s, true);
  updateStatus();
}
function updateStatusSafe() { if (screens.length) updateStatus(); }

function deleteSelection() {
  if (!selected.size) return;
  const sc = curScreen();
  for (const s of selected) s.el.remove();
  sc.sprites = sc.sprites.filter(s => !selected.has(s));
  selected.clear();
  updateStatus();
}

// Clipboard: picks + sizes + positions relative to the copied group's
// top-left, so a paste keeps the arrangement. Survives tab switches, so
// things can be copied from one given to another.
let clipboard = null;
function copySelection() {
  if (!selected.size) return;
  const list = curScreen().sprites.filter(s => selected.has(s));   // keep layer order
  const ox = Math.min(...list.map(s => s.x)), oy = Math.min(...list.map(s => s.y));
  clipboard = list.map(s => ({ pick: JSON.parse(JSON.stringify(s.pick)),
                               dx: s.x - ox, dy: s.y - oy, w: s.w, h: s.h }));
}
// Paste with the group's top-left at (x, y); defaults to a nudge from center
function pasteClipboard(x, y) {
  if (!clipboard || !clipboard.length) return;
  const sc = curScreen();
  if (x == null) { x = BOARD_W / 2 - 64; y = BOARD_H / 2 - 64; }
  const added = clipboard.map(c => addSprite(sc, JSON.parse(JSON.stringify(c.pick)),
                                             x + c.dx, y + c.dy, c.w, c.h));
  selectOnly(added);
}

// ── Pointer input: select / marquee / move / long-press ───────────────────────
// Pointer events cover mouse, pen and a single finger alike, so tap-and-drag
// on a tablet does exactly what click-and-drag does with a mouse:
//  • on a sprite: select it (Shift toggles) and drag the selection to move it
//  • on empty board: drag a marquee — everything it touches gets selected
// A finger held still for LONG_PRESS_MS (or a right-click) opens the
// Copy / Paste / Delete menu; Paste lands where the press was.
const LONG_PRESS_MS = 500, LONG_PRESS_TOL = 10;

function boardPoint(sc, e) {
  const r = sc.board.getBoundingClientRect();
  return { x: (e.clientX - r.left) / boardScale, y: (e.clientY - r.top) / boardScale };
}

function wireBoard(sc) {
  const board = sc.board;
  let g = null;          // current gesture
  let lpTimer = null;

  const endGesture = () => {
    clearTimeout(lpTimer); lpTimer = null;
    if (!g) return;
    if (g.marquee) g.marquee.remove();
    for (const s of selected) s.el.classList.remove('dragging');
    g = null;
  };

  board.addEventListener('contextmenu', e => e.preventDefault());

  board.addEventListener('pointerdown', e => {
    if (g) return;                        // a second finger — ignore it
    hideSelMenu();
    const p = boardPoint(sc, e);
    const s = spriteOfEl.get(e.target);
    if (e.button === 2) {                 // right-click → the menu
      if (s && !selected.has(s)) selectOnly([s]);
      showSelMenu(e.clientX, e.clientY, p);
      return;
    }
    if (e.button !== 0) return;
    e.preventDefault();
    board.setPointerCapture(e.pointerId);
    g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, start: p, moved: false };
    if (s) {
      if (e.shiftKey) { setSel(s, !selected.has(s)); updateStatus(); g.mode = 'none'; }
      else {
        if (!selected.has(s)) selectOnly([s]);
        g.mode = 'move';
        g.orig = [...selected].map(t => ({ t, x: t.x, y: t.y }));
      }
    } else {
      g.mode = 'marquee';
      g.base = e.shiftKey ? new Set(selected) : new Set();
      if (!e.shiftKey) clearSelection();
    }
    if (e.pointerType !== 'mouse') {
      lpTimer = setTimeout(() => {
        lpTimer = null;
        if (!g || g.moved) return;
        const { sx, sy, start } = g;
        endGesture();
        if (navigator.vibrate) navigator.vibrate(15);
        showSelMenu(sx, sy, start);
      }, LONG_PRESS_MS);
    }
  });

  board.addEventListener('pointermove', e => {
    if (!g || e.pointerId !== g.id) return;
    const dxs = e.clientX - g.sx, dys = e.clientY - g.sy;
    if (!g.moved && dxs * dxs + dys * dys > LONG_PRESS_TOL * LONG_PRESS_TOL) {
      g.moved = true;
      clearTimeout(lpTimer); lpTimer = null;
    }
    if (!g.moved) return;
    const p = boardPoint(sc, e);
    if (g.mode === 'move') {
      const dx = p.x - g.start.x, dy = p.y - g.start.y;
      for (const o of g.orig) {
        o.t.x = Math.round(Math.max(-o.t.w + 16, Math.min(BOARD_W - 16, o.x + dx)));
        o.t.y = Math.round(Math.max(-o.t.h + 16, Math.min(BOARD_H - 16, o.y + dy)));
        o.t.el.classList.add('dragging');
        placeSprite(o.t);
      }
    } else if (g.mode === 'marquee') {
      if (!g.marquee) {
        g.marquee = document.createElement('div');
        g.marquee.className = 'marquee';
        board.appendChild(g.marquee);
      }
      const x0 = Math.min(g.start.x, p.x), y0 = Math.min(g.start.y, p.y);
      const x1 = Math.max(g.start.x, p.x), y1 = Math.max(g.start.y, p.y);
      Object.assign(g.marquee.style, { left: x0 + 'px', top: y0 + 'px',
                                       width: (x1 - x0) + 'px', height: (y1 - y0) + 'px' });
      for (const t of sc.sprites) {
        const hit = t.x < x1 && t.x + t.w > x0 && t.y < y1 && t.y + t.h > y0;
        setSel(t, hit || g.base.has(t));
      }
      updateStatus();
    }
  });

  const up = e => { if (g && e.pointerId === g.id) endGesture(); };
  board.addEventListener('pointerup', up);
  board.addEventListener('pointercancel', up);
}

makeScreen('problem');
switchScreen(0);

// ── Long-press / right-click menu ─────────────────────────────────────────────
const selMenu = document.getElementById('selMenu');
let menuPoint = null;   // board point the menu was opened at — where Paste lands
function showSelMenu(x, y, boardPt) {
  menuPoint = boardPt;
  document.getElementById('selMenuCopy').disabled   = !selected.size;
  document.getElementById('selMenuDelete').disabled = !selected.size;
  document.getElementById('selMenuPaste').disabled  = !(clipboard && clipboard.length);
  selMenu.classList.add('open');
  selMenu.style.left = '-9999px'; selMenu.style.top = '-9999px';
  const r = selMenu.getBoundingClientRect();
  selMenu.style.left = Math.max(8, Math.min(x - r.width / 2, window.innerWidth - r.width - 8)) + 'px';
  selMenu.style.top  = Math.max(8, Math.min(y - r.height - 14, window.innerHeight - r.height - 8)) + 'px';
}
function hideSelMenu() { selMenu.classList.remove('open'); }
document.getElementById('selMenuCopy').onclick = () => {
  hideSelMenu();
  copySelection();   // clipboard only — Paste places it
  document.getElementById('stSel').textContent = 'copied ' + selected.size + ' ✓';
  setTimeout(updateStatus, 1500);
};
document.getElementById('selMenuPaste').onclick = () => {
  hideSelMenu();
  pasteClipboard(menuPoint && menuPoint.x, menuPoint && menuPoint.y);
};
document.getElementById('selMenuDelete').onclick = () => { hideSelMenu(); deleteSelection(); };
document.addEventListener('pointerdown', e => {
  if (selMenu.classList.contains('open') && !selMenu.contains(e.target) &&
      !e.target.closest('.board')) hideSelMenu();
}, true);

// ── Save → Puzzle Guide ───────────────────────────────────────────────────────
// Puzzles live in puzzles_studio.js (STUDIO_PUZZLES), which the Puzzle Guide,
// Map Studio and the game all load; puzzles_curated_data.js turns each one
// into ordinary chunks. Saving rewrites that file through the GitHub API with
// this puzzle added — or replaced, when saving the same number again.
function flash(msg, color) {
  const f = document.getElementById('saveFlash');
  f.textContent = msg; f.style.color = color || '#4a9a60';
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { f.textContent = ''; }, 4000);
}

function puzzleData() {
  return {
    num: puzzleNum, name: '؟؟؟', loc: '', updated: Date.now(),
    board: { w: BOARD_W, h: BOARD_H, safe: { w: safeW, h: safeH } },
    screens: screens.map((sc, i) => ({
      label: screenLabel(i), kind: sc.kind,
      sprites: sc.sprites.map(s => {
        const src = sourceOf(s.pick);
        return {
          src: s.pick.kind === 'sheet' ? SHEETS[s.pick.sheet].src
             : s.pick.kind === 'anim' ? s.pick.anim.src : s.pick.src,
          x: src.x, y: src.y, w: src.w, h: src.h,
          iw: src.img.naturalWidth, ih: src.img.naturalHeight,
          bx: s.x, by: s.y, bw: s.w, bh: s.h,
          pick: s.pick,   // what was picked, so Load restores it exactly (animations too)
        };
      }),
    })),
  };
}

const STUDIO_FILE = 'puzzles_studio.js';
const STUDIO_HEADER =
`/* Puzzles made in Puzzle Studio — this file is rewritten by Puzzle Studio's
   Save button (via the GitHub API), so don't hand-edit it. Each entry holds
   the puzzle's screens (problem p<N>p1, givens p<N>g1…) with their sprites;
   puzzles_curated_data.js turns them into curated-page chunks. */
`;

// Current STUDIO_PUZZLES straight from the repo (not the deployed copy, which
// can lag a minute behind a save). Falls back to the copy this page loaded.
async function readStudioFile() {
  const headers = tsGhToken() ? tsGhHeaders() : { Accept: 'application/vnd.github+json' };
  const r = await fetch(tsGhApi(STUDIO_FILE) + '?ref=' + TS_GH.branch, { headers, cache: 'no-store' });
  if (r.status === 404) return { list: [], sha: null };
  if (!r.ok) throw await tsGhFail(r);
  const j = await r.json();
  const text = decodeURIComponent(escape(atob(j.content.replace(/\s/g, ''))));
  const m = text.match(/const STUDIO_PUZZLES = ([\s\S]*);\s*$/);
  return { list: m ? JSON.parse(m[1]) : [], sha: j.sha };
}

let saving = false;
async function savePuzzle() {
  if (saving) return;
  if (!tsGhToken()) {
    const t = (prompt('Saving writes the puzzle to the website (GitHub repo).\n' +
      'Paste your GitHub token — the same one Map Studio → My Maps uses:') || '').trim();
    if (!t) return;
    localStorage.setItem('ghToken', t);
  }
  saving = true;
  document.getElementById('saveBtn').disabled = true;
  flash('saving…', '#b8a06a');
  try {
    const { list, sha } = await readStudioFile();
    const data = puzzleData();
    const i = list.findIndex(p => +p.num === puzzleNum);
    if (i >= 0) {
      // keep a name/location that was filled in elsewhere
      data.name = list[i].name || data.name;
      data.loc  = list[i].loc  || data.loc;
      list[i] = data;
    } else list.push(data);
    list.sort((a, b) => a.num - b.num);
    const text = STUDIO_HEADER + 'const STUDIO_PUZZLES = ' + JSON.stringify(list, null, 1) + ';\n';
    const body = { message: `Save puzzle ${puzzleNum} from Puzzle Studio`,
                   content: btoa(unescape(encodeURIComponent(text))), branch: TS_GH.branch };
    if (sha) body.sha = sha;
    const w = await fetch(tsGhApi(STUDIO_FILE), { method: 'PUT', headers: tsGhHeaders(), body: JSON.stringify(body) });
    if (!w.ok) throw await tsGhFail(w);
    editingSaved = true;
    updatePuzzleLabel();
    flash(`saved puzzle ${puzzleNum} to the Puzzle Guide ✓`);
  } catch (e) {
    if (/bad credentials/i.test(e.message)) localStorage.removeItem('ghToken');
    flash('save failed ✗ ' + e.message, '#cc7070');
  } finally {
    saving = false;
    document.getElementById('saveBtn').disabled = false;
  }
}

// ── Load (Puzzle Studio puzzles only) ─────────────────────────────────────────
// Lists the puzzles in puzzles_studio.js — hand-made Puzzle Guide puzzles
// aren't built from sprites, so they can't be opened here.
const loadOverlay = document.getElementById('loadOverlay');
async function openLoadPanel() {
  loadOverlay.classList.add('open');
  const box = document.getElementById('loadList');
  box.innerHTML = '<div class="hint-text">loading…</div>';
  let list;
  try { list = (await readStudioFile()).list; }
  catch (e) { list = typeof STUDIO_PUZZLES !== 'undefined' ? STUDIO_PUZZLES : []; }
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = '<div class="hint-text">no Puzzle Studio puzzles saved yet — build one and press Save</div>';
    return;
  }
  for (const p of list) {
    const row = document.createElement('div');
    row.className = 'load-item';
    const givens = p.screens.filter(s => s.kind === 'given').length;
    const when = p.updated ? new Date(p.updated).toLocaleString() : '';
    row.innerHTML = `<span class="ln">Puzzle ${p.num}</span>` +
      `<span class="ld">${givens} given${givens === 1 ? '' : 's'}${when ? ' · ' + when : ''}</span>`;
    const b = document.createElement('button');
    b.textContent = 'Load';
    b.onclick = () => loadPuzzle(p);
    row.appendChild(b);
    box.appendChild(row);
  }
}
function closeLoadPanel() { loadOverlay.classList.remove('open'); }

// A sprite saved before picks were stored comes back as a plain image crop
function pickFromSaved(sp) {
  return sp.pick || { kind: 'image', name: '', src: sp.src, x: sp.x, y: sp.y, w: sp.w, h: sp.h,
                      sw: sp.w / SHEET_TILE, sh: sp.h / SHEET_TILE };
}

function loadPuzzle(p) {
  const hasWork = screens.some(sc => sc.sprites.length) || screens.length > 1;
  if (hasWork && !confirm(`Open Puzzle ${p.num}? What's on the boards now will be replaced.`)) return;
  closeLoadPanel();
  clearSelection();
  for (const sc of screens) sc.board.remove();
  screens.length = 0;
  cur = 0;
  puzzleNum = +p.num;
  editingSaved = true;
  BOARD_W = (p.board && +p.board.w) || 1280;
  BOARD_H = (p.board && +p.board.h) || 720;
  safeW = (p.board && p.board.safe && +p.board.safe.w) || BOARD_W;
  safeH = (p.board && p.board.safe && +p.board.safe.h) || BOARD_H;
  const ordered = [...p.screens.filter(s => s.kind === 'problem'), ...p.screens.filter(s => s.kind === 'given')];
  if (!ordered.length || ordered[0].kind !== 'problem') ordered.unshift({ kind: 'problem', sprites: [] });
  for (const saved of ordered) {
    const sc = makeScreen(saved.kind);
    for (const sp of saved.sprites) addSprite(sc, pickFromSaved(sp), sp.bx, sp.by, sp.bw, sp.bh);
  }
  updatePuzzleLabel();
  switchScreen(0);
  flash(`opened puzzle ${p.num} — Save updates it`);
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';

  // The tileset picker's shortcuts (same as Map Studio)
  if (tsOverlay.classList.contains('open')) {
    if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
    if (e.key === 'Escape') { tsCancel(); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      if (!document.getElementById('tsUseBtn').disabled) tsUse();
      e.preventDefault(); return;
    }
    const arrow = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (arrow && tsSheet !== 'animated') {
      tsNudge(arrow[0], arrow[1], e.shiftKey);
      e.preventDefault();
    }
    return;
  }
  if (loadOverlay.classList.contains('open')) {
    if (e.key === 'Escape') closeLoadPanel();
    return;
  }
  if (typing) return;

  if (e.key === 'Escape') { hideSelMenu(); clearSelection(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selected.size) { deleteSelection(); e.preventDefault(); }
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === 'c') { copySelection(); e.preventDefault(); }
    else if (k === 'v') { pasteClipboard(); e.preventDefault(); }
    else if (k === 'a') { selectOnly(curScreen().sprites); e.preventDefault(); }
    else if (k === 's') { savePuzzle(); e.preventDefault(); }
  }
});
</script>
