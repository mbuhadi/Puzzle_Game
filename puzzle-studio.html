<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cinzel+Decorative:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tileset_picker.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Same palette as Map Studio's default (Desert Gold) theme */
:root {
  --gold:     #c8a84b;
  --gold-dim: #7a6030;
  --bg:       #0e0d0a;
  --bg2:      #14120e;
  --bg3:      #1e1a12;
  --border:   #2e2a1e;
  --text:     #d4ba88;
  --dim:      #6a5c3a;
  --hover:    #231d0e;
  --check1:   #171512;
  --check2:   #1d1a15;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: 'Cinzel', serif; }

#app { display: flex; flex-direction: column; height: 100%; }

/* ── Top bar ──────────────────────────────────────────────────────────────── */
#topbar {
  height: 42px; flex-shrink: 0;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 4px; padding: 0 10px;
}
#puzzleLabel { font-size: 12px; color: var(--text); letter-spacing: 1px; margin-right: 8px; white-space: nowrap; }
#saveFlash { font-family: monospace; font-size: 10px; margin-left: 6px; white-space: nowrap; }
.tb-title {
  font-family: 'Cinzel Decorative', serif; font-size: 12px;
  color: var(--gold); letter-spacing: 2px; margin-right: 10px; white-space: nowrap;
}

button {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.5px;
  padding: 5px 11px; border-radius: 3px; cursor: pointer; white-space: nowrap;
}
button:hover { border-color: var(--gold-dim); color: var(--gold); }
button.active { border-color: var(--gold); color: var(--gold); }
button:disabled { opacity: 0.35; cursor: default; }
button:disabled:hover { border-color: var(--border); color: var(--text); }
.hint-text { font-family: sans-serif; font-size: 10px; color: var(--dim); line-height: 1.5; letter-spacing: 0; }

/* ── Screen tabs: the Problem plus its Givens (styled like Map Studio's rooms) */
#screenTabs {
  height: 32px; flex-shrink: 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-end; gap: 3px; padding: 4px 8px 0 8px;
  overflow-x: auto; overflow-y: hidden;
}
#screenTabs::-webkit-scrollbar { height: 3px; }
#screenTabs::-webkit-scrollbar-thumb { background: var(--border); }
.screen-tab {
  display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  padding: 5px 8px 5px 12px;
  background: var(--bg2); border: 1px solid var(--border); border-bottom: none;
  border-radius: 6px 6px 0 0; cursor: pointer;
  font-size: 11px; letter-spacing: 0.5px; color: var(--dim);
  user-select: none; white-space: nowrap;
}
.screen-tab:hover { color: var(--text); }
.screen-tab.active { background: var(--bg3); border-color: var(--gold-dim); color: var(--gold); }
.screen-tab.problem { padding-right: 12px; }
.tab-x { font-size: 12px; line-height: 1; padding: 0 2px; border-radius: 2px; color: var(--dim); }
.tab-x:hover { color: #cc7070; }
#addGivenBtn {
  flex-shrink: 0; align-self: center; margin-left: 4px;
  font-size: 10px; padding: 3px 9px;
}

/* ── Main: sidebar + board ────────────────────────────────────────────────── */
#main { flex: 1; display: flex; min-height: 0; }
#sidebar {
  width: 210px; flex-shrink: 0; overflow-y: auto;
  background: var(--bg2); border-right: 1px solid var(--border); padding: 12px;
}
.sec-title { font-size: 9px; letter-spacing: 2.5px; color: var(--dim); margin-bottom: 8px; }

#stageWrap {
  flex: 1; min-width: 0; position: relative; overflow: hidden;
  background: repeating-conic-gradient(var(--check1) 0% 25%, var(--check2) 0% 50%) 0 0 / 32px 32px;
}
/* A puzzle "screen" — a fixed 16:9 board scaled to fit the space. One per
   tab (the Problem and each Given); only the active tab's board is shown. */
.board {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
  transform-origin: 0 0; background: #080705;
  border: 1px solid var(--gold-dim); box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  touch-action: none; overflow: hidden;
}
.board:not(.active) { display: none; }
.sprite {
  position: absolute; image-rendering: pixelated; cursor: grab;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.sprite.dragging { cursor: grabbing; outline: 2px solid var(--gold); }

#statusbar {
  height: 24px; flex-shrink: 0; display: flex; align-items: center; gap: 16px;
  padding: 0 10px; background: var(--bg2); border-top: 1px solid var(--border);
  font-family: monospace; font-size: 10px; color: var(--dim);
}

/* ── Overlay dialogs (the tileset picker) ─────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82);
  z-index: 500; display: none; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.overlay-box {
  display: flex; flex-direction: column; max-width: 94vw;
  background: var(--bg2); border: 1px solid var(--gold-dim);
  border-radius: 6px; overflow: hidden;
}
.overlay-head {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
  flex-wrap: wrap;
}

@media (max-width: 700px) {
  #sidebar { width: 150px; padding: 8px; }
}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <span class="tb-title">PUZZLE STUDIO</span>
    <span id="puzzleLabel"></span>
    <button id="saveBtn" onclick="savePuzzle()" title="Save this puzzle to the Puzzle Guide (commits it to the website's GitHub repo)">Save</button>
    <span id="saveFlash"></span>
  </div>

  <div id="screenTabs">
    <!-- tabs injected by renderTabs() -->
    <button id="addGivenBtn" onclick="addGiven()" title="Add a given to this puzzle — it opens in its own tab">+ Given</button>
  </div>

  <div id="main">
    <div id="sidebar">
      <div class="sec-title">OBJECTS</div>
      <button onclick="openTileset()" style="width:100%" title="Pick a sprite from the tilesets — it lands on the board, then drag it into place">Browse Tileset…</button>
    </div>
    <div id="stageWrap"></div>
  </div>

  <div id="statusbar">
    <span id="stScreen">Problem</span>
    <span id="stCount">0 objects</span>
    <span>pick from Browse Tileset, then drag it anywhere on the board · + Given adds a given tab</span>
  </div>

</div>

<script src="puzzles_studio.js"></script>
<script src="puzzles_curated_data.js"></script>
<script src="assets/anim_manifest.js"></script>
<script src="assets/tileset_picker.js"></script>
<script>
// ── Puzzle Studio ─────────────────────────────────────────────────────────────
// A puzzle is its Problem screen plus any number of Given screens, each a
// 1280×720 board in its own tab. Boards are filled from the shared Browse
// Tileset picker (assets/tileset_picker.js): each pick becomes a sprite on
// the active tab's board (drawn at 4× — one 16px tile = 64 board px — or
// shrunk to fit if it's a big picture) that can be dragged anywhere.
const BOARD_W = 1280, BOARD_H = 720, PX = 4;
const stageWrap = document.getElementById('stageWrap');
let boardScale = 1;

// ── Screens (tabs) ────────────────────────────────────────────────────────────
const screens = [];   // {kind: 'problem'|'given', board: <div>, sprites: [{el, pick, x, y}]}
let cur = 0;          // index of the active tab
function curScreen() { return screens[cur]; }
// The new puzzle continues the Puzzle Guide's numbering: one past the
// highest puzzle number there (hand-made or saved from here)
const PUZZLE_NUM = Math.max(0, ...PUZZLES.map(p => +p.num || 0)) + 1;
document.getElementById('puzzleLabel').textContent = 'Puzzle ' + PUZZLE_NUM;
document.title = 'Puzzle Studio — Puzzle ' + PUZZLE_NUM;

// Chunk labels match the Puzzle Guide's: p9p1 = problem, p9g1… = givens
function screenLabel(i) {
  return screens[i].kind === 'problem' ? `p${PUZZLE_NUM}p1` : `p${PUZZLE_NUM}g${i}`;   // givens follow the problem
}
function screenName(i) {
  return (screens[i].kind === 'problem' ? 'Problem' : 'Given ' + i) + ' · ' + screenLabel(i);
}

function makeScreen(kind) {
  const board = document.createElement('div');
  board.className = 'board';
  stageWrap.appendChild(board);
  const sc = { kind, board, sprites: [] };
  screens.push(sc);
  fitBoard();
  return sc;
}

function switchScreen(i) {
  cur = i;
  screens.forEach((sc, j) => sc.board.classList.toggle('active', j === i));
  renderTabs();
  updateStatus();
}

function addGiven() {
  makeScreen('given');
  switchScreen(screens.length - 1);
}

function deleteGiven(i) {
  const sc = screens[i];
  if (sc.kind !== 'given') return;
  if (sc.sprites.length &&
      !confirm(`Delete ${screenName(i)} and the ${sc.sprites.length} object(s) on it?`)) return;
  sc.board.remove();
  screens.splice(i, 1);
  switchScreen(cur === i ? i - 1 : cur > i ? cur - 1 : cur);
}

function renderTabs() {
  const bar = document.getElementById('screenTabs');
  bar.querySelectorAll('.screen-tab').forEach(t => t.remove());
  const addBtn = document.getElementById('addGivenBtn');
  screens.forEach((sc, i) => {
    const tab = document.createElement('div');
    tab.className = 'screen-tab' + (i === cur ? ' active' : '') + (sc.kind === 'problem' ? ' problem' : '');
    const nm = document.createElement('span');
    nm.textContent = screenName(i);
    tab.appendChild(nm);
    if (sc.kind === 'given') {
      const x = document.createElement('span');
      x.className = 'tab-x';
      x.textContent = '×';
      x.title = 'Delete this given';
      x.onclick = e => { e.stopPropagation(); deleteGiven(i); };
      tab.appendChild(x);
    }
    tab.onclick = () => switchScreen(i);
    bar.insertBefore(tab, addBtn);
  });
}

function updateStatus() {
  const n = curScreen().sprites.length;
  document.getElementById('stScreen').textContent = screenName(cur);
  document.getElementById('stCount').textContent = n + (n === 1 ? ' object' : ' objects');
}

// Fit the boards inside the stage area, centered
function fitBoard() {
  const m = 16;
  const w = stageWrap.clientWidth - m * 2, h = stageWrap.clientHeight - m * 2;
  boardScale = Math.max(0.1, Math.min(w / BOARD_W, h / BOARD_H));
  const x = (stageWrap.clientWidth  - BOARD_W * boardScale) / 2;
  const y = (stageWrap.clientHeight - BOARD_H * boardScale) / 2;
  for (const sc of screens)
    sc.board.style.transform = `translate(${x}px, ${y}px) scale(${boardScale})`;
}
new ResizeObserver(fitBoard).observe(stageWrap);

makeScreen('problem');
switchScreen(0);

// ── Sprites ───────────────────────────────────────────────────────────────────

function sourceOf(pick) {
  if (pick.kind === 'sheet') {
    const u = SHEET_TILE;
    return { img: sheetImg(pick.sheet), x: pick.sx * u, y: pick.sy * u,
             w: pick.sw * u, h: pick.sh * u, stride: 0, frames: 1, ms: 1000 };
  }
  if (pick.kind === 'anim') {
    const a = pick.anim;
    return { img: stripImg(a.src), x: a.x, y: a.y, w: a.w, h: a.h,
             stride: a.stride, frames: a.frames, ms: a.ms };
  }
  return { img: stripImg(pick.src), x: pick.x, y: pick.y, w: pick.w, h: pick.h,
           stride: 0, frames: 1, ms: 1000 };
}

const SHEET_IMGS = {};
function sheetImg(key) {
  if (!SHEET_IMGS[key]) { const im = new Image(); im.src = SHEETS[key].src; SHEET_IMGS[key] = im; }
  return SHEET_IMGS[key];
}

function drawSprite(s) {
  const src = sourceOf(s.pick), cv = s.el, g = cv.getContext('2d');
  const im = src.img;
  if (!(im.complete && im.naturalWidth)) {
    im.addEventListener('load', () => drawSprite(s), { once: true });
    return;
  }
  // Loop animations continuously (doors included) so the board shows movement
  const f = src.frames > 1 ? Math.floor(performance.now() / src.ms) % src.frames : 0;
  g.clearRect(0, 0, cv.width, cv.height);
  g.imageSmoothingEnabled = false;
  g.drawImage(im, src.x + f * src.stride, src.y, src.w, src.h, 0, 0, cv.width, cv.height);
}

function placeSprite(s) {
  s.el.style.left = s.x + 'px';
  s.el.style.top  = s.y + 'px';
}

// Called by the picker's "Use Selection" — drop the pick in the center of
// the active tab's board
function onTilesetUse(pick) {
  const src = sourceOf(pick);
  const cv = document.createElement('canvas');
  cv.className = 'sprite';
  cv.width = src.w; cv.height = src.h;
  // Pixel art shows at 4×; anything big (an uploaded picture) is shrunk to
  // fit within 60% of the board instead of dwarfing it
  const k = Math.min(PX, BOARD_W * 0.6 / src.w, BOARD_H * 0.6 / src.h);
  const w = Math.round(src.w * k), h = Math.round(src.h * k);
  cv.style.width  = w + 'px';
  cv.style.height = h + 'px';
  const sc = curScreen();
  const s = { el: cv, pick,
              x: Math.round((BOARD_W - w) / 2), y: Math.round((BOARD_H - h) / 2) };
  sc.sprites.push(s);
  sc.board.appendChild(cv);
  placeSprite(s);
  drawSprite(s);
  enableDrag(s, sc);
  updateStatus();
}

// Drag with mouse, pen or finger. Deltas are divided by the board's display
// scale so the sprite tracks the pointer exactly.
function enableDrag(s, sc) {
  let start = null;
  s.el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    s.el.setPointerCapture(e.pointerId);
    start = { px: e.clientX, py: e.clientY, x: s.x, y: s.y, id: e.pointerId };
    s.el.classList.add('dragging');
    sc.board.appendChild(s.el);   // bring to front while dragging
    sc.sprites.push(sc.sprites.splice(sc.sprites.indexOf(s), 1)[0]);
  });
  s.el.addEventListener('pointermove', e => {
    if (!start || e.pointerId !== start.id) return;
    const w = s.el.offsetWidth, h = s.el.offsetHeight;
    s.x = Math.round(Math.max(-w + 16, Math.min(BOARD_W - 16, start.x + (e.clientX - start.px) / boardScale)));
    s.y = Math.round(Math.max(-h + 16, Math.min(BOARD_H - 16, start.y + (e.clientY - start.py) / boardScale)));
    placeSprite(s);
  });
  const end = e => {
    if (!start || e.pointerId !== start.id) return;
    start = null;
    s.el.classList.remove('dragging');
  };
  s.el.addEventListener('pointerup', end);
  s.el.addEventListener('pointercancel', end);
}

// Animated picks keep playing on the visible board
setInterval(() => {
  for (const s of curScreen().sprites) if (sourceOf(s.pick).frames > 1) drawSprite(s);
}, 60);

// ── Save → Puzzle Guide ───────────────────────────────────────────────────────
// Puzzles live in puzzles_studio.js (STUDIO_PUZZLES), which the Puzzle Guide,
// Map Studio and the game all load; puzzles_curated_data.js turns each one
// into ordinary chunks. Saving rewrites that file through the GitHub API with
// this puzzle added — or replaced, when saving the same number again.
function flash(msg, color) {
  const f = document.getElementById('saveFlash');
  f.textContent = msg; f.style.color = color || '#4a9a60';
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { f.textContent = ''; }, 4000);
}

function puzzleData() {
  return {
    num: PUZZLE_NUM, name: '؟؟؟', loc: '', updated: Date.now(),
    screens: screens.map((sc, i) => ({
      label: screenLabel(i), kind: sc.kind,
      sprites: sc.sprites.map(s => {
        const src = sourceOf(s.pick);
        return {
          src: s.pick.kind === 'sheet' ? SHEETS[s.pick.sheet].src
             : s.pick.kind === 'anim' ? s.pick.anim.src : s.pick.src,
          x: src.x, y: src.y, w: src.w, h: src.h,
          iw: src.img.naturalWidth, ih: src.img.naturalHeight,
          // style size, not offsetWidth — boards of other tabs are display:none
          bx: s.x, by: s.y, bw: parseFloat(s.el.style.width), bh: parseFloat(s.el.style.height),
        };
      }),
    })),
  };
}

const STUDIO_FILE = 'puzzles_studio.js';
const STUDIO_HEADER =
`/* Puzzles made in Puzzle Studio — this file is rewritten by Puzzle Studio's
   Save button (via the GitHub API), so don't hand-edit it. Each entry holds
   the puzzle's screens (problem p<N>p1, givens p<N>g1…) with their sprites;
   puzzles_curated_data.js turns them into curated-page chunks. */
`;

let saving = false;
async function savePuzzle() {
  if (saving) return;
  if (!tsGhToken()) {
    const t = (prompt('Saving writes the puzzle to the website (GitHub repo).\n' +
      'Paste your GitHub token — the same one Map Studio → My Maps uses:') || '').trim();
    if (!t) return;
    localStorage.setItem('ghToken', t);
  }
  saving = true;
  document.getElementById('saveBtn').disabled = true;
  flash('saving…', '#b8a06a');
  try {
    // Read the current file through the API (not the deployed copy) so a save
    // a minute ago that hasn't deployed yet isn't lost
    const r = await fetch(tsGhApi(STUDIO_FILE) + '?ref=' + TS_GH.branch,
                          { headers: tsGhHeaders(), cache: 'no-store' });
    let list = [], sha = null;
    if (r.ok) {
      const j = await r.json();
      sha = j.sha;
      const text = decodeURIComponent(escape(atob(j.content.replace(/\s/g, ''))));
      const m = text.match(/const STUDIO_PUZZLES = ([\s\S]*);\s*$/);
      list = m ? JSON.parse(m[1]) : [];
    } else if (r.status !== 404) throw await tsGhFail(r);

    const data = puzzleData();
    const i = list.findIndex(p => +p.num === PUZZLE_NUM);
    if (i >= 0) list[i] = data; else list.push(data);
    list.sort((a, b) => a.num - b.num);
    const text = STUDIO_HEADER + 'const STUDIO_PUZZLES = ' + JSON.stringify(list, null, 1) + ';\n';
    const body = { message: `Save puzzle ${PUZZLE_NUM} from Puzzle Studio`,
                   content: btoa(unescape(encodeURIComponent(text))), branch: TS_GH.branch };
    if (sha) body.sha = sha;
    const w = await fetch(tsGhApi(STUDIO_FILE), { method: 'PUT', headers: tsGhHeaders(), body: JSON.stringify(body) });
    if (!w.ok) throw await tsGhFail(w);
    flash(`saved puzzle ${PUZZLE_NUM} to the Puzzle Guide ✓`);
  } catch (e) {
    if (/bad credentials/i.test(e.message)) localStorage.removeItem('ghToken');
    flash('save failed ✗ ' + e.message, '#cc7070');
  } finally {
    saving = false;
    document.getElementById('saveBtn').disabled = false;
  }
}

// ── Keyboard: the picker's shortcuts (same as Map Studio) ─────────────────────
window.addEventListener('keydown', e => {
  if (!tsOverlay.classList.contains('open')) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (e.key === 'Escape') { tsCancel(); e.preventDefault(); return; }
  if (e.key === 'Enter') {
    if (!document.getElementById('tsUseBtn').disabled) tsUse();
    e.preventDefault(); return;
  }
  const arrow = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (arrow && tsSheet !== 'animated') {
    tsNudge(arrow[0], arrow[1], e.shiftKey);
    e.preventDefault();
  }
});
</script>
</body>
</html>
