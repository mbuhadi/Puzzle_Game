<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pattern Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #14120e; color: #e8e2d0; font: 13px system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  /* the same CRT look as test mode: scanlines and dark corners */
  #crt { position: fixed; inset: 0; pointer-events: none; }
  #crt::before { content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0, rgba(0,0,0,.16) 1px, transparent 1px, transparent 3px); }
  #crt::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }
  #panel { position: fixed; left: 10px; top: 10px; background: rgba(20,18,14,.88); border: 1px solid #4a4434; border-radius: 8px;
    padding: 8px 10px; max-width: min(360px, calc(100vw - 40px)); display: flex; flex-direction: column; gap: 6px; }
  #panel.min > :not(.head) { display: none; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .5px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { background: #2a261e; color: #e8e2d0; border: 1px solid #4a4434; border-radius: 5px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button.sel { border-color: #d6b25e; color: #d6b25e; }
  .sw { width: 20px; height: 20px; border-radius: 50%; padding: 0; border: 2px solid rgba(0,0,0,.4); }
  .sw.sel { border-color: #fff; }
  label { display: flex; gap: 6px; align-items: center; }
  input[type=range] { width: 130px; }
  .dim { color: #9a927c; font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="crt"></div>
<div id="panel">
  <div class="head"><span>PATTERN PREVIEW</span><button id="hide">–</button></div>
  <div class="row" id="pats"></div>
  <div class="row" id="styles"></div>
  <div class="row" id="cols"></div>
  <label>Size <input type="range" id="size" min="12" max="48" value="26"><span id="sizeV" class="dim"></span></label>
  <label>Speed <input type="range" id="speed" min="0" max="12" step=".5" value="3"><span id="speedV" class="dim"></span></label>
  <div class="dim">120 pixels across · two brightness levels (50% and 100% of the colour)</div>
</div>
<script>
// Each pattern gives every point (x, y), in background pixels, a region
// label. Where the label changes between neighbouring pixels a line is drawn;
// "filled" lights up the regions fill(label) picks instead.
const R2 = Math.SQRT2;
const near = (v, P) => v - P * Math.round(v / P);   // offset from the nearest lattice line
const nearLine = near, TILING_SIZE = 26;
// Pixel-art sprites for the sprite tilings: '#' is lit. One sprite pixel is
// one background pixel at 1× size (bigger sizes use whole multiples).
const FANOUS = [
  '....###....',
  '....#.#....',
  '....###....',
  '.....#.....',
  '...#####...',
  '..#######..',
  '.#########.',
  '..#.#.#.#..',
  '.##.#.#.##.',
  '.#.##.##.#.',
  '.##.#.#.##.',
  '.#.##.##.#.',
  '.##.#.#.##.',
  '..#.#.#.#..',
  '.#########.',
  '..#######..',
  '...#####...',
  '....###....',
  '.....#.....',
];
const TULIP = [
  '.....#.....',
  '....###....',
  '.#..###..#.',
  '.##.###.##.',
  '.###.#.###.',
  '.#########.',
  '..#######..',
  '...#####...',
  '.....#.....',
  '.....#.....',
  '.##..#.....',
  '..##.#..##.',
  '...###.##..',
  '.....###...',
  '.....#.....',
];
const CRESCENT = [
  '...............',
  '....###........',
  '...###.........',
  '..###..........',
  '.####..........',
  '.####......#...',
  '#####.....###..',
  '#####....#####.',
  '#####.....###..',
  '.#####....#.#..',
  '.######........',
  '..#######..#...',
  '...########....',
  '....######.....',
  '...............',
];
const DALLAH = [
  '.....#.......',
  '....###......',
  '.....#.......',
  '....###......',
  '...#####.....',
  '....###...##.',
  '#...###..#..#',
  '.#..###..#..#',
  '..#.###...#.#',
  '...#####...##',
  '...######..#.',
  '..########.#.',
  '.##########..',
  '.##########..',
  '..########...',
  '...######....',
  '..########...',
  '.##########..',
];
const PALM = [
  '......##.##......',
  '...####.#.####...',
  '.###...###...###.',
  '##...#######...##',
  '#...##..#..##...#',
  '...##...#...##...',
  '..##....#....##..',
  '..#.....##....#..',
  '.........#.......',
  '.........#.......',
  '........##.......',
  '........#........',
  '........#........',
  '........##.......',
  '.........#.......',
  '.....#########...',
];
const MOSQUE = [
  '..#.......#.......#..',
  '..#......#.#......#..',
  '.###......#......###.',
  '.###.....###.....###.',
  '.###...#######...###.',
  '#####.#########.#####',
  '.###.###########.###.',
  '.###.###########.###.',
  '.###.###########.###.',
  '.###################.',
  '.###################.',
  '.####.##.###.##.####.',
  '.###..##.#.#.##..###.',
  '.###..##.#.#.##..###.',
  '.###################.',
];
const CAMEL = [
  '.##..................',
  '####.................',
  '.###.................',
  '..##.........###.....',
  '...##.....#######....',
  '....##...#########...',
  '.....#############...',
  '.....##############..',
  '......############.#.',
  '......##.......##..#.',
  '......#.#......#.#...',
  '......#.#......#.#...',
  '.....##.##....##.##..',
];
// A sprite on staggered rows (every other row shifted by half), drawn in
// whole background pixels; P sets the sprite's scale and the space between
function spriteTile(x, y, P, spr) {
  const n = Math.max(1, Math.round(P / TILING_SIZE)), sw = spr[0].length * n, sh = spr.length * n;
  const cw = sw + P * .35, ch = sh + P * .15, row = Math.floor(y / ch), off = row % 2 ? cw / 2 : 0;
  const sx = Math.floor((x - off - cw * Math.floor((x - off) / cw) - (cw - sw) / 2) / n);
  const sy = Math.floor((y - row * ch - (ch - sh) / 2) / n);
  return sy >= 0 && sy < spr.length && sx >= 0 && sx < spr[0].length && spr[sy][sx] === '#';
}
const MORE = {
  // Mamluk ten-point stars, each holding a dark ten-point star with a lit
  // centre, and a small diamond where four stars meet
  ten(x, y, P) {
    const sx = nearLine(x, P), sy = nearLine(y, P), r = Math.hypot(sx, sy);
    const seg = Math.PI / 5, m = ((Math.atan2(sy, sx) % seg) + seg) % seg, phi = seg / 2 - Math.abs(m - seg / 2);   // angle from the nearest tip
    const star = Ro => {
      // inside the ten-point star: on the centre's side of the edge from a tip to the next inner corner
      const Ri = Ro * .62, ax = Ro, ay = 0, bx = Ri * Math.cos(seg / 2), by = Ri * Math.sin(seg / 2);
      const px = r * Math.cos(phi), py = Math.abs(r * Math.sin(phi));
      return (bx - ax) * (py - ay) - (by - ay) * (px - ax) >= 0;
    };
    const Ro = P * .45;
    if (star(Ro)) return !star(Ro * .5) || r <= Ro * .2;
    const cx = Math.abs(nearLine(x - P / 2, P)), cy = Math.abs(nearLine(y - P / 2, P));
    return cx + cy <= P * .13;
  },
  // fish-scale tiles (as on domes and Alhambra walls): rows of overlapping
  // scales with rounded lower edges, each with a dark rim and an inner arc
  scales(x, y, P) {
    const R = P / 2, row0 = Math.floor(y / R);
    for (let row = row0 - 1; row <= row0 + 1; row++) {   // each row lies over the one below it
      const off = row % 2 ? R : 0, cx = P * Math.round((x - off) / P) + off, cy = row * R, d = Math.hypot(x - cx, y - cy);
      if (d <= R) return !(d > R - 1.4 || (y >= cy && Math.abs(d - R * .55) < .7));
    }
    return false;
  },
  // Ramadan lanterns (fanous), in pixel art, on staggered rows
  fanous(x, y, P) { return spriteTile(x, y, P, FANOUS); },
  // Ottoman tulips, in pixel art, on staggered rows
  tulips(x, y, P) { return spriteTile(x, y, P, TULIP); },
  crescent(x, y, P) { return spriteTile(x, y, P, CRESCENT); },
  dallah(x, y, P) { return spriteTile(x, y, P, DALLAH); },
  palm(x, y, P) { return spriteTile(x, y, P, PALM); },
  mosque(x, y, P) { return spriteTile(x, y, P, MOSQUE); },
  camel(x, y, P) { return spriteTile(x, y, P, CAMEL); },
};
const PATTERNS = [
  { id: 'khatam', n: 'Eight-point stars & crosses',
    label(x, y, P) {
      const lx = Math.abs(near(x, P)), ly = Math.abs(near(y, P)), a = P * .354;
      return Math.max(lx, ly) <= a || (lx + ly) / R2 <= a ? 1 : 0;
    }, fill: l => l === 1 },
  { id: 'hizb', n: 'Interlaced squares',
    label(x, y, P) {
      const lx = Math.abs(near(x, P)), ly = Math.abs(near(y, P)), a = P * .4;
      return (Math.max(lx, ly) <= a ? 1 : 0) + ((lx + ly) / R2 <= a ? 2 : 0);
    }, fill: l => l === 1 || l === 2 },
  { id: 'arches', n: 'Moorish arches',
    label(x, y, P) {
      // rows of pointed arches (each from two circles, as in an arcade),
      // every other row shifted by half an arch
      const RH = P * 1.25, row = Math.floor(y / RH), sx = row % 2 ? P / 2 : 0;
      const lx = near(x + sx, P), ly = y - row * RH;   // ly: 0 at the row's top
      const b = P * .32, top = RH * .5, bottom = RH * .92;
      if (Math.abs(lx) > b || ly > bottom) return 0;
      if (ly >= top) return 1;
      return Math.hypot(lx - b, ly - top) <= 2 * b && Math.hypot(lx + b, ly - top) <= 2 * b ? 1 : 0;
    }, fill: l => l === 1 },
  { id: 'mashrabiya', n: 'Mashrabiya lattice',
    label(x, y, P) {
      const u = (x + y) / P, v = (x - y) / P;
      const fu = u - Math.round(u), fv = v - Math.round(v);
      const gu = u - Math.floor(u) - .5, gv = v - Math.floor(v) - .5;
      let l = (Math.floor(u) * 7 + Math.floor(v) * 13) * 4;
      if (Math.max(Math.abs(fu), Math.abs(fv)) < .17) return -1;   // a small square where the bars cross
      if (Math.abs(gu) + Math.abs(gv) < .22) l += 1;                // a little diamond in each opening
      return l;
    }, fill: l => l === -1 || (l & 3) === 1 },
  { id: 'octagon', n: 'Octagons, squares & stars',
    label(x, y, P) {
      const ix = Math.round(x / P), iy = Math.round(y / P), lx = Math.abs(x - ix * P), ly = Math.abs(y - iy * P);
      if ((lx + ly) / R2 > P / 2 * .93) return -1;   // the little squares between octagons
      const a = P * .22, star = Math.max(lx, ly) <= a || (lx + ly) / R2 <= a;
      return (ix * 31 + iy * 17) * 2 + (star ? 1 : 0);
    }, fill: l => l === -1 || (l & 1) === 1 },
  // ── New designs ── (each scales the size slider by its own k, as they need more room)
  { id: 'rosette', n: 'Zellige rosettes', k: 1.15,
    // an eight-point star ringed by eight pointed petals, the pieces cut apart
    // by thin dark joints like tile work, with a small star where four
    // rosettes meet
    label(x, y, P) {
      const ix = Math.round(x / P), iy = Math.round(y / P), sx = x - ix * P, sy = y - iy * P;
      const lx = Math.abs(sx), ly = Math.abs(sy), r = Math.hypot(sx, sy), th = Math.atan2(sy, sx);
      const star = a => Math.max(lx, ly) <= a || (lx + ly) / R2 <= a;
      const a = P * .2, joint = .8;
      if (star(a)) return 1;
      // petals: between the star and an octagon turned 22.5°, so each petal
      // ends in a point between two of the star's points
      const t8 = Math.PI / 8, rx = Math.abs(sx * Math.cos(t8) + sy * Math.sin(t8)), ry = Math.abs(-sx * Math.sin(t8) + sy * Math.cos(t8));
      const R = P * .44, oct = m => Math.max(rx, ry) <= R - m && (rx + ry) / R2 <= R - m;
      if (!oct(0)) {
        const cx = Math.abs(near(x - P / 2, P)), cy = Math.abs(near(y - P / 2, P)), b = P * .09;
        return Math.max(cx, cy) <= b || (cx + cy) / R2 <= b ? 1 : 0;
      }
      if (!oct(joint * 1.5) || star(a + joint * 1.8)) return 0;
      const k = Math.round(th / (Math.PI / 4)) * Math.PI / 4;
      return r * Math.abs(Math.sin(th - k)) <= joint ? 0 : 1;   // joints running out from the star's points
    }, fill: l => l === 1 },
  { id: 'twelve', n: 'Twelve-point stars', k: 1.6,
    // Alhambra-style twelve-point stars (three squares turned 30° apart) on a
    // triangular lattice: each star has a dark inner outline and a bright
    // centre, and a small hexagon sits in each gap between three stars
    label(x, y, P) {
      const H = P * Math.sqrt(3) / 2, v = y / H, u = x / P - v / 2;
      let best = null, bd = 1e9;
      for (const du of [0, 1]) for (const dv of [0, 1]) {
        const i = Math.floor(u) + du, j = Math.floor(v) + dv, cx = (i + j / 2) * P, cy = j * H, d = (x - cx) ** 2 + (y - cy) ** 2;
        if (d < bd) { bd = d; best = [x - cx, y - cy]; }
      }
      const [px, py] = best;
      const star = a => [0, Math.PI / 6, Math.PI / 3].some(t => {
        const c = Math.cos(t), s2 = Math.sin(t);
        return Math.max(Math.abs(px * c + py * s2), Math.abs(-px * s2 + py * c)) <= a;
      });
      const a = P * .29;
      if (star(a)) return star(a - 2.2) && !star(a - 3.3) ? 0 : 1;
      const th = Math.atan2(py, px), k = Math.round((th - Math.PI / 6) / (Math.PI / 3)) * Math.PI / 3 + Math.PI / 6;
      const gx = px - Math.cos(k) * P / Math.sqrt(3), gy = py - Math.sin(k) * P / Math.sqrt(3), hr = P * .085;
      return [0, 1, 2].every(n => Math.abs(gx * Math.cos(n * Math.PI / 3 + Math.PI / 6) + gy * Math.sin(n * Math.PI / 3 + Math.PI / 6)) <= hr) ? 1 : 0;
    }, fill: l => l === 1 },
  { id: 'trellis', n: 'Moroccan quatrefoils', k: 1.45,
    // quatrefoils (four round lobes) with pointed tips reaching out to their
    // diagonal neighbours: the dark gaps between them form a curved trellis
    label(x, y, P) {
      const sx = near(x, P), sy = near(y, P), lx = Math.abs(sx), ly = Math.abs(sy);
      const d = P * .23, rr = P * .135;
      if (Math.hypot(lx - d, ly) <= rr || Math.hypot(lx, ly - d) <= rr || Math.hypot(lx, ly) <= P * .1) return 1;
      // tips along the diagonals, narrowing to a point just short of the next one
      const s2 = (lx + ly) / R2, t2 = Math.abs(lx - ly) / R2, L = P * .69, w = P * .075;
      return s2 <= L && t2 <= w * (1 - s2 / L) ? 1 : 0;
    }, fill: l => l === 1 },
  { id: 'weave', n: 'Woven strapwork', k: 1.25,
    // interlaced diagonal straps going over and under in turn, with a thin
    // dark gap where a strap passes under, and a small diamond in each opening
    label(x, y, P) {
      const u = (x + y) / P, v = (x - y) / P, fu = Math.abs(u - Math.round(u)) * P / R2, fv = Math.abs(v - Math.round(v)) * P / R2;
      const bw = P * .11, gap = 1.1, aOver = (Math.round(u) + Math.round(v)) % 2 === 0;
      const inA = fu <= bw, inB = fv <= bw;
      if (inA && inB) return 1;
      if (inA) return !aOver && fv <= bw + gap ? 0 : 1;   // strap A dips under B
      if (inB) return aOver && fu <= bw + gap ? 0 : 1;    // strap B dips under A
      const gu = u - Math.floor(u) - .5, gv = v - Math.floor(v) - .5;
      return Math.abs(gu) + Math.abs(gv) < .13 ? 1 : 0;
    }, fill: l => l === 1 },
  { id: 'ten', n: 'Ten-point stars', k: 1.3, label: (x, y, P) => MORE.ten(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'scales', n: 'Fish scales', k: 0.9, label: (x, y, P) => MORE.scales(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'fanous', n: 'Ramadan lanterns', k: 1, label: (x, y, P) => MORE.fanous(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'tulips', n: 'Ottoman tulips', k: 0.85, label: (x, y, P) => MORE.tulips(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'crescent', n: 'Crescent moons', k: 0.9, label: (x, y, P) => MORE.crescent(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'dallah', n: 'Dallah coffee pots', k: 1, label: (x, y, P) => MORE.dallah(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'palm', n: 'Date palms', k: 1, label: (x, y, P) => MORE.palm(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'mosque', n: 'Mosques', k: 1.15, label: (x, y, P) => MORE.mosque(x, y, P) ? 1 : 0, fill: l => l === 1 },
  { id: 'camel', n: 'Camels', k: 1.15, label: (x, y, P) => MORE.camel(x, y, P) ? 1 : 0, fill: l => l === 1 },
];
const COLOURS = [
  ['Zellige turquoise', '#3f9a8c'], ['Saffron', '#c9963f'], ['Terracotta', '#b5603f'], ['Cobalt tile', '#3f62a8'], ['Palm green', '#6f8a4a'],
  ['Midnight indigo', '#3f4a8f'], ['Deep violet', '#5b3f8f'], ['Spectral lavender', '#8a6fc0'], ['Haunted plum', '#7a3f7a'], ['Ghost teal', '#4f8f9a'],
  ['Deep sea', '#2f5f9a'], ['Lagoon teal', '#2f8a8f'], ['Aqua', '#3fa0a8'], ['Seaweed', '#3f8a6a'], ['Coral', '#c06a5a'],
  ['Leaf green', '#4f8f4f'], ['Olive', '#8a8f3f'], ['Sunflower', '#c4a03f'], ['Rose', '#b8607a'], ['Lavender', '#8a6fb0'],
];
const ACROSS = 120, LOW = .5, HIGH = 1;

const q = new URLSearchParams(location.search);
const st = {
  pat: PATTERNS.find(p => p.id === q.get('p')) || PATTERNS[0],
  style: q.get('style') === 'fill' ? 'fill' : 'line',
  col: q.get('c') ? '#' + q.get('c') : COLOURS[0][1],
  size: +q.get('size') || 26,
  speed: q.has('speed') ? +q.get('speed') : 3,
};
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

function ui() {
  const pats = document.getElementById('pats'); pats.innerHTML = '';
  for (const p of PATTERNS) { const b = document.createElement('button'); b.textContent = p.n; b.className = p === st.pat ? 'sel' : ''; b.onclick = () => { st.pat = p; ui(); }; pats.append(b); }
  const sty = document.getElementById('styles'); sty.innerHTML = '';
  for (const [id, n] of [['line', 'Lines'], ['fill', 'Filled']]) { const b = document.createElement('button'); b.textContent = n; b.className = id === st.style ? 'sel' : ''; b.onclick = () => { st.style = id; ui(); }; sty.append(b); }
  const cols = document.getElementById('cols'); cols.innerHTML = '';
  for (const [n, c] of COLOURS) { const b = document.createElement('button'); b.className = 'sw' + (c === st.col ? ' sel' : ''); b.style.background = c; b.title = n; b.onclick = () => { st.col = c; ui(); }; cols.append(b); }
  document.getElementById('size').value = st.size; document.getElementById('sizeV').textContent = st.size + ' px';
  document.getElementById('speed').value = st.speed; document.getElementById('speedV').textContent = st.speed + ' px/s';
}
document.getElementById('size').oninput = e => { st.size = +e.target.value; ui(); };
document.getElementById('speed').oninput = e => { st.speed = +e.target.value; ui(); };
document.getElementById('hide').onclick = () => document.getElementById('panel').classList.toggle('min');
if (q.has('hide')) document.getElementById('panel').classList.add('min');
ui();

const cv = document.getElementById('cv'), g = cv.getContext('2d');
let lab = null, img = null, lastKey = '';
function frame(now) {
  const W = innerWidth, H = innerHeight, w = ACROSS, h = Math.ceil(ACROSS * H / W);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; img = g.createImageData(w, h); lab = new Float64Array((w + 1) * (h + 1)); lastKey = ''; }
  // the pattern travels diagonally, one whole background pixel at a time
  const d = (q.has('t') ? +q.get('t') : now / 1000) * st.speed, ox = Math.floor(d), oy = Math.floor(d * .5);
  const key = [st.pat.id, st.style, st.col, st.size, ox, oy, w, h].join('|');
  if (key !== lastKey) {
    lastKey = key;
    const P = st.size * (st.pat.k || 1);
    for (let y = 0, j = 0; y <= h; y++) for (let x = 0; x <= w; x++, j++) lab[j] = st.pat.label(x + ox + .5, y + oy + .5, P);
    const base = hexRgb(st.col), lo = base.map(v => v * LOW), hi = base.map(v => v * HIGH), p = img.data;
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
      const j = y * (w + 1) + x, l = lab[j];
      const on = st.style === 'fill' ? st.pat.fill(l) : (l !== lab[j + 1] || l !== lab[j + w + 1]);
      const c = on ? hi : lo;
      p[i] = c[0]; p[i + 1] = c[1]; p[i + 2] = c[2]; p[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
