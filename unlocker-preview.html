<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courtyard Locks — preview</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Look-only preview of pixel-art constant unlockers: four-dial vertical
   locks styled as artifacts from an Arabic courtyard house. Several versions
   side by side ("Compare"); pick one to see its mini version in the top-right
   corner of a mock screen and its big, interactive version. Dials turn and
   the button presses, but nothing is checked yet. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0e0d0a; color: #d4ba88; font-family: 'Cinzel', serif; overflow: hidden; }
#screen { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse at 30% 40%, #7d93ad 0%, #5f7690 35%, #48596f 70%, #34404f 100%); }
#board { position: absolute; left: 50%; top: 54%; width: min(70vw, 900px); aspect-ratio: 16 / 9; transform: translate(-50%, -50%);
  border: 3px solid rgba(240,247,255,.85); border-radius: 4px; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; padding: 10px; }
#board div { background: #2f4a66; border: 2px solid rgba(240,247,255,.9); border-radius: 4px; }
#board div:nth-child(2) { grid-row: span 2; }
#crt { position: absolute; inset: 0; pointer-events: none; z-index: 30;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 120px rgba(0,0,0,.55); }
#mini { position: absolute; top: 14px; right: 16px; z-index: 10; cursor: pointer; image-rendering: pixelated;
  animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
#mini:hover { animation-play-state: paused; transform: scale(1.12) rotate(-4deg); }
@keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
#ov { position: absolute; inset: 0; z-index: 20; background: rgba(8,8,10,.62); display: none; align-items: center; justify-content: center; }
#ov.open { display: flex; }
#big { image-rendering: pixelated; touch-action: none; filter: drop-shadow(0 10px 0 rgba(0,0,0,.35)); animation: pop .32s cubic-bezier(.3,1.7,.5,1); }
@keyframes pop { from { transform: scale(.6) } to { transform: scale(1) } }
/* compare view: every version side by side */
#cmp { position: absolute; inset: 0; z-index: 25; background: rgba(8,8,10,.72); display: none; align-items: flex-end; justify-content: center; gap: 3vw; padding: 60px 20px 40px; }
#cmp.open { display: flex; }
#cmp figure { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
#cmp canvas { image-rendering: pixelated; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
#cmp figcaption { font: 12px 'Cinzel', serif; color: #e8dfc8; letter-spacing: 1px; text-align: center; }
#cmp figcaption small { display: block; font: 10px sans-serif; color: rgba(232,223,200,.65); letter-spacing: 0; margin-top: 2px; }
#cmp figure:hover figcaption { color: #ffd166; }
#hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; z-index: 40; font: 11px sans-serif; color: rgba(255,255,255,.7); pointer-events: none; }
#opts { position: absolute; left: 12px; top: 12px; z-index: 40; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100vw - 120px); }
#opts button { background: #1e1a12; border: 1px solid #2e2a1e; color: #d4ba88; font: 11px 'Cinzel', serif; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
#opts button.on { border-color: #c8a84b; color: #c8a84b; }
#opts .gap { width: 10px; }
</style>
</head>
<body>
<div id="screen">
  <div id="board"><div></div><div></div><div></div><div></div><div></div></div>
  <canvas id="mini" title="Open the lock"></canvas>
  <div id="ov"><canvas id="big"></canvas></div>
  <div id="cmp"></div>
  <div id="crt"></div>
</div>
<div id="opts"></div>
<div id="hint"></div>
<script>
// ── Palettes ──
const C = {
  ink: '#1a1008', win: '#140c05', cream: '#fff6d8',
  brassD: '#5a3a12', brassS: '#8a5d1c', brass: '#bb8a34', brassL: '#e2bb63', brassH: '#fff0b0',
  woodD: '#2a160a', woodS: '#4a2812', wood: '#6b3d1d', woodL: '#8f5a2e', woodH: '#b98552',
  tq: '#2a9d8f', tqL: '#7fdccd', tqD: '#17594f', ivory: '#efe3c4', ivoryS: '#c9b98f', ivoryD: '#8f7d57',
  ebony: '#2b1d14', ebonyS: '#1b120c', ebonyL: '#4a3526', gold: '#f2c14e', goldD: '#a77a22',
  blue: '#2f5fa8', blueL: '#7fa6e0', blueD: '#1d3a68', red: '#b0392c',
};
// Materials: plate (S/base/L/H) and tile band colours
const MAT = {
  brass: { D: C.brassD, S: C.brassS, B: C.brass, L: C.brassL, H: C.brassH, lat: C.brassS },
  wood:  { D: C.woodD,  S: C.woodS,  B: C.wood,  L: C.woodL,  H: C.woodH,  lat: C.woodS },
  copper:{ D: '#4a2414', S: '#7c3c22', B: '#a95a35', L: '#d48a5a', H: '#f6c79a', lat: '#7c3c22' },
};
const BAND = {
  tq:   [C.tq, C.ivory, C.tqD],
  blue: [C.blue, C.ivory, C.blueD],
  brass:[C.brassL, C.brass, C.brassS],
};

// ── 5×7 digit glyphs (drawn at 1× or 2×) ──
const GLYPHS = {
  ar: [
    ['.....','.....','..#..','.#.#.','..#..','.....','.....'],
    ['.#...','..#..','..#..','..#..','..#..','..#..','..#..'],
    ['.#.##','.#.#.','.##..','.#...','.#...','.#...','.#...'],
    ['#.#.#','#####','#....','#....','#....','#....','#....'],
    ['.###.','#....','.##..','#....','#....','.####','.....'],
    ['.....','.###.','#...#','#...#','#...#','.###.','.....'],
    ['####.','...#.','...#.','...#.','...#.','...#.','...#.'],
    ['#...#','#...#','.#.#.','.#.#.','.#.#.','..#..','..#..'],
    ['..#..','..#..','.#.#.','.#.#.','.#.#.','#...#','#...#'],
    ['.##..','#..#.','#..#.','.###.','...#.','...#.','...#.'],
  ],
  en: [
    ['.###.','#...#','#..##','#.#.#','##..#','#...#','.###.'],
    ['..#..','.##..','..#..','..#..','..#..','..#..','.###.'],
    ['.###.','#...#','....#','...#.','..#..','.#...','#####'],
    ['####.','....#','....#','.###.','....#','....#','####.'],
    ['...#.','..##.','.#.#.','#..#.','#####','...#.','...#.'],
    ['#####','#....','####.','....#','....#','#...#','.###.'],
    ['.###.','#....','#....','####.','#...#','#...#','.###.'],
    ['#####','....#','...#.','..#..','.#...','.#...','.#...'],
    ['.###.','#...#','#...#','.###.','#...#','#...#','.###.'],
    ['.###.','#...#','#...#','.####','....#','....#','.###.'],
  ],
};
let digitSet = 'ar';

// ── The versions ──
// W: plate width (art px) · k: arch pointedness (bigger = rounder) · springY:
// where the arch meets the sides · ww: dial window width · gs: digit scale
// (1 = 5×7, 2 = 10×14) · arrows: 'side' (▲▼ beside each dial) or 'carets'
// (tap the top / bottom half of a dial) · dial: 'ivory' | 'ebony'
const VARIANTS = [
  { id: 'C', name: 'Lantern', note: 'the one you picked · for reference',
    W: 46, k: .64, springY: 42, ww: 30, gs: 2, pad: 3, arrows: 'carets', dial: 'ivory', mat: 'brass', band: 'tq', star: 6 },
  // bulkier: wider plate, thicker bevel and tile border, chunkier dials, and
  // more colours (a 3–4 colour tile border, a coloured star, button and rims)
  { id: 'C2', name: 'Saffron', note: 'bulkier · turquoise, saffron & red',
    W: 60, k: .64, springY: 46, ww: 34, gs: 2, pad: 4, arrows: 'carets', dial: 'ivory', mat: 'brass', star: 7, edge: 3, bw: 4,
    pal: { tiles: ['#2a9d8f', '#efe3c4', '#e0a030', '#efe3c4'], grout: '#17594f', star: ['#b0392c', '#f2c14e', '#6e1f17'],
      btn: ['#17594f', '#2a9d8f', '#7fdccd'], rim: ['#6e1f17', '#d0564a'], studs: '#e0a030' } },
  { id: 'C3', name: 'Garden', note: 'bulkier · emerald, rose & ivory',
    W: 60, k: .64, springY: 46, ww: 34, gs: 2, pad: 4, arrows: 'carets', dial: 'ivory', mat: 'brass', star: 7, edge: 3, bw: 4,
    pal: { tiles: ['#2f8f55', '#efe3c4', '#d47a8c', '#efe3c4'], grout: '#1b4f30', star: ['#2f8f55', '#f5d0d8', '#1b4f30'],
      btn: ['#8a3a4a', '#d47a8c', '#f5c4cf'], rim: ['#1b4f30', '#5cbf83'], studs: '#d47a8c' } },
  { id: 'C4', name: 'Majlis', note: 'bulkier · cobalt, turquoise & ochre',
    W: 60, k: .64, springY: 46, ww: 34, gs: 2, pad: 4, arrows: 'carets', dial: 'ivory', mat: 'brass', star: 7, edge: 3, bw: 4,
    pal: { tiles: ['#2f5fa8', '#efe3c4', '#2a9d8f', '#d79a35'], grout: '#1d3a68', star: ['#d79a35', '#fff0b0', '#7a4f12'],
      btn: ['#1d3a68', '#2f5fa8', '#7fa6e0'], rim: ['#1d3a68', '#5b8bd6'], studs: '#2a9d8f' } },
  { id: 'C5', name: 'Sunset', note: 'bulkier · copper, terracotta & turquoise',
    W: 60, k: .64, springY: 46, ww: 34, gs: 2, pad: 4, arrows: 'carets', dial: 'ivory', mat: 'copper', star: 7, edge: 3, bw: 4,
    pal: { tiles: ['#c4553a', '#f3e2bf', '#2a9d8f', '#f3e2bf'], grout: '#6e2a1a', star: ['#2a9d8f', '#bff0e6', '#17594f'],
      btn: ['#6e2a1a', '#c4553a', '#f0a080'], rim: ['#17594f', '#4cc2b2'], studs: '#2a9d8f' } },
];
// Derived layout (art px) for a version
function geo(v) {
  const x0 = 3, x1 = v.W - 4, cx = Math.round((x0 + x1) / 2);
  const gh = 7 * v.gs, dh = gh + v.pad * 2 + 4;                  // one dial row incl. its brass band
  const side = v.arrows === 'side' ? 6 : 0;
  const wx = cx - Math.round(v.ww / 2) - Math.round(side / 2), wy = v.springY - 6;
  const wh = dh * 4 + 1;
  const yBot = wy + wh + 15;
  const H = yBot + 28;
  return { x0, x1, cx, gh, dh, wx, wy, wh, ww: v.ww, yb: v.springY, yBot, H, ax: wx + v.ww + 6 };
}

// ── Pixel helpers (1 unit = 1 art pixel) ──
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function glyph(g, d, x, y, s, c, clipY0 = -1e9, clipY1 = 1e9) {
  const G = GLYPHS[digitSet][d];
  for (let j = 0; j < 7; j++) for (let i = 0; i < 5; i++)
    if (G[j][i] === '#') for (let b = 0; b < s; b++) { const yy = y + j * s + b; if (yy >= clipY0 && yy < clipY1) rect(g, x + i * s, yy, s, 1, c); }
}
function inArch(x, y, x0, x1, yb, yBot, k) {
  if (x < x0 || x > x1 || y > yBot) return false;
  if (y >= yb) return true;
  const w = x1 - x0, R = k * w, cA = x0 + R, cB = x1 - R;
  return Math.hypot(x - cA, y - yb) <= R && Math.hypot(x - cB, y - yb) <= R;
}
function star(g, cx, cy, r, fill, edge) {
  const inS = (x, y) => (Math.abs(x) <= r * .72 && Math.abs(y) <= r * .72) || (Math.abs(x + y) <= r && Math.abs(x - y) <= r);
  for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) {
    if (inS(x, y)) px(g, cx + x, cy + y, fill);
    else if (inS(x + 1, y) || inS(x - 1, y) || inS(x, y + 1) || inS(x, y - 1)) px(g, cx + x, cy + y, edge);
  }
}
function tri(g, cx, y, dir, M) {
  const rows = [0, 1, 2, 3].map(r => dir > 0 ? r : 3 - r);
  rows.forEach((r, j) => rect(g, cx - r - 1, y + j, 2 * r + 3, 1, C.ink));
  rows.forEach((r, j) => { if (r) rect(g, cx - r + 1, y + j, 2 * r - 1, 1, dir > 0 && j < 2 ? M.H : M.L); });
  rect(g, cx - 4, dir > 0 ? y + 4 : y - 1, 9, 1, C.ink);
}
function plate(g, v, G, M, band) {
  const { x0, x1, yb, yBot } = G, k = v.k, IN = (x, y, a = 0, b = 0, c = 0) => inArch(x, y, x0 + a, x1 - a, yb + b, yBot - c, k);
  const H = G.H, e = v.edge || 2, o = e + 1, bw = v.bw || 3;
  const tiles = v.pal ? v.pal.tiles : [band[0], band[1]], grout = v.pal ? v.pal.grout : band[2];
  for (let y = 0; y < H; y++) for (let x = 0; x < v.W; x++) {
    if (!IN(x, y)) { if (IN(x - 1, y) || IN(x + 1, y) || IN(x, y + 1) || IN(x, y - 1)) px(g, x, y, C.ink); continue; }
    const edge = !IN(x - e, y) || !IN(x + e, y) || !IN(x, y - e) || !IN(x, y + e);
    if (edge) { px(g, x, y, !IN(x - e, y - e) ? (!IN(x - 1, y - 1) ? M.H : M.L) : M.S); continue; }
    const inBand = !IN(x, y, o + bw, 2, o + bw) && IN(x, y, o, 0, o);
    if (inBand) {
      const gr = (x + y) % 3 === 0 || (x - y + 300) % 3 === 0;
      const t = Math.floor((x + y) / 3) + 2 * Math.floor((x - y + 300) / 3);
      px(g, x, y, gr ? grout : tiles[((t % tiles.length) + tiles.length) % tiles.length]);
      continue;
    }
    const lat = (x + y) % 6 === 0 || (x - y + 600) % 6 === 0;
    px(g, x, y, lat ? M.lat : M.B);
  }
}

// ── A whole big lock ──
function drawLock(g, v, st, now) {
  const G = geo(v), M = MAT[v.mat], band = BAND[v.band] || BAND.tq;
  g.clearRect(0, 0, v.W, G.H);
  plate(g, v, G, M, band);
  const { cx, wx, wy, ww, dh, gh } = G;
  const P = v.pal;
  star(g, cx, Math.round(wy - v.star - 6), v.star, P ? P.star[0] : band === BAND.brass ? C.brassL : band[0], C.ink);
  star(g, cx, Math.round(wy - v.star - 6), Math.max(2, Math.round(v.star / 2)), P ? P.star[1] : band === BAND.brass ? C.brassH : C.tqL, P ? P.star[2] : band === BAND.brass ? C.brassS : band[2]);
  // dial window
  rect(g, wx - 2, wy - 2, ww + 4, G.wh + 4, C.ink);
  rect(g, wx - 1, wy - 1, ww + 2, G.wh + 2, M.D);
  rect(g, wx, wy, ww, G.wh, C.win);
  const ebony = v.dial === 'ebony';
  for (let i = 0; i < 4; i++) {
    const dy = wy + 1 + i * dh, h = dh - 3;
    for (let y = 0; y < h; y++) {
      const t = Math.abs(y - (h - 1) / 2) / ((h - 1) / 2);
      rect(g, wx + 1, dy + y, ww - 2, 1, ebony ? (t > .8 ? C.ebonyS : t > .5 ? C.ebony : C.ebonyL) : (t > .8 ? C.ivoryD : t > .5 ? C.ivoryS : C.ivory));
    }
    rect(g, wx + 1, dy + 2, 2, h - 4, ebony ? C.ebonyL : C.cream);
    const d = st.dials[i], r = st.roll[i], gx = wx + Math.round(ww / 2) - Math.round(5 * v.gs / 2);
    const step = gh + v.pad + 2;
    for (const kk of [-1, 0, 1]) {
      const yy = dy + Math.round((h - gh) / 2) + kk * step + Math.round(r * v.gs);
      glyph(g, (d + kk + 10) % 10, gx, yy, v.gs, kk ? (ebony ? C.goldD : C.ivoryD) : (ebony ? C.gold : '#3a2410'), dy, dy + h);
    }
    // carets on the dial: tap its top / bottom half
    if (v.arrows === 'carets') {
      const cc = ebony ? C.goldD : '#a8956a';
      rect(g, cx - 1, dy + 1, 3, 1, cc); px(g, cx, dy, cc);
      rect(g, cx - 1, dy + h - 2, 3, 1, cc); px(g, cx, dy + h - 1, cc);
    }
    // band between dials (coloured rim on the colourful versions)
    rect(g, wx, dy + h, ww, 1, P ? P.rim[0] : M.S); rect(g, wx, dy + h + 1, ww, 1, P ? P.rim[1] : M.L);
    const mid = dy + Math.floor(h / 2);
    if (v.arrows === 'side') { tri(g, G.ax, mid - 6, 1, M); tri(g, G.ax, mid + 2, -1, M); }
    else { const sc = P ? P.studs : band[0]; rect(g, wx - 5, mid - 1, 3, 3, C.ink); px(g, wx - 4, mid, sc); rect(g, wx + ww + 2, mid - 1, 3, 3, C.ink); px(g, wx + ww + 3, mid, sc); }
  }
  // keyhole + rivets
  const ky = wy + G.wh + 4;
  rect(g, cx - 2, ky, 5, 4, C.ink); rect(g, cx - 1, ky + 4, 3, 5, C.ink); rect(g, cx - 1, ky + 1, 3, 2, C.win);
  for (const [rx, ry] of [[G.x0 + 6, G.yBot - 6], [G.x1 - 6, G.yBot - 6]]) { rect(g, rx - 1, ry - 1, 3, 3, C.ink); px(g, rx, ry, M.H); }
  // button plaque
  const pressed = now - st.pressAt < 140;
  const bx = Math.max(2, Math.round(v.W / 2 - 34)), bw = v.W - 2 * bx, by = G.yBot + 7 + (pressed ? 1 : 0), bh = 15;
  if (!pressed) rect(g, bx, by + 2, bw, bh, C.ink);
  rect(g, bx, by, bw, bh, C.ink);
  const B0 = P ? P.btn : band === BAND.brass ? [C.brassS, C.brass, C.brassH] : [band[2], band[0], band === BAND.blue ? C.blueL : C.tqL];
  rect(g, bx + 1, by + 1, bw - 2, bh - 2, B0[0]); rect(g, bx + 1, by + 1, bw - 2, bh - 4, B0[1]); rect(g, bx + 2, by + 2, bw - 4, 1, B0[2]);
  return { G, button: { x: bx, y: by, w: bw, h: bh } };
}
// text on the scaled canvas in the pop-text style (Silkscreen, dark outline)
function popWord(g, text, x, y, size, fill) {
  g.font = `700 ${size}px 'Silkscreen', monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(3, size * .28); g.strokeStyle = C.ink;
  g.strokeText(text, x, y); g.fillStyle = fill; g.fillText(text, x, y);
}
function fitWord(g, text, maxW, size) {
  g.font = `700 ${size}px 'Silkscreen', monospace`;
  while (size > 6 && g.measureText(text).width > maxW) { size--; g.font = `700 ${size}px 'Silkscreen', monospace`; }
  return size;
}

// ── Mini (top-right corner): the same plate in miniature ──
function miniSize(v) { const W = Math.max(14, Math.round(v.W * .3)); return { W, H: Math.round(W * 1.45) }; }
function drawMini(g, v) {
  const { W, H } = miniSize(v), M = MAT[v.mat], band = v.pal ? [v.pal.tiles[0], v.pal.tiles[2], v.pal.grout] : BAND[v.band];
  const x0 = 1, x1 = W - 2, yb = Math.round(H * .38), yBot = H - 2, k = v.k;
  const IN = (x, y, a = 0, b = 0) => inArch(x, y, x0 + a, x1 - a, yb + b, yBot - a, k);
  g.clearRect(0, 0, W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!IN(x, y)) { if (IN(x - 1, y) || IN(x + 1, y) || IN(x, y + 1) || IN(x, y - 1)) px(g, x, y, C.ink); continue; }
    const edge = !IN(x - 1, y) || !IN(x + 1, y) || !IN(x, y - 1) || !IN(x, y + 1);
    const inB = !edge && !IN(x, y, 2, 1);
    px(g, x, y, edge ? (!IN(x - 1, y - 1) ? M.H : M.S) : inB ? ((x + y) % 2 ? band[0] : band[1]) : M.B);
  }
  const cx = Math.round((x0 + x1) / 2), sw = Math.max(4, W - 10), wx = cx - Math.floor(sw / 2), wy = yb - 2;
  star(g, cx, wy - 4, 1, v.pal ? v.pal.star[0] : band[0], C.ink);
  const slot = Math.max(3, Math.floor((yBot - 6 - wy) / 4)), ebony = v.dial === 'ebony';
  rect(g, wx - 1, wy - 1, sw + 2, slot * 4 + 1, C.ink);
  for (let i = 0; i < 4; i++) {
    rect(g, wx, wy + i * slot, sw, slot - 1, ebony ? C.ebonyL : C.ivory);
    rect(g, wx, wy + i * slot + slot - 2, sw, 1, ebony ? C.ebonyS : C.ivoryS);
    rect(g, cx - 1, wy + i * slot + Math.max(0, Math.floor((slot - 3) / 2)), 2, Math.max(1, slot - 2), ebony ? C.gold : '#3a2410');
  }
  return { W, H };
}

// ── State, scaling and drawing ──
let cur = VARIANTS[1];
const st = { dials: [1, 9, 4, 7], roll: [0, 0, 0, 0], pressAt: -1e9, popAt: -1e9 };
const art = document.createElement('canvas');
const big = document.getElementById('big'), mini = document.getElementById('mini');
let BS = 4, MS = 3, lastHit = null;
function blit(target, w, h, s, fn) {
  art.width = w; art.height = h;
  const r = fn(art.getContext('2d'));
  if (target.width !== w * s || target.height !== h * s) { target.width = w * s; target.height = h * s; }
  const g = target.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, target.width, target.height);
  g.drawImage(art, 0, 0, w * s, h * s);
  return { g, r };
}
function bigScale(v, fracW = 1) { const G = geo(v); return Math.max(2, Math.floor(Math.min((innerHeight - 70) / G.H, (innerWidth * fracW - 30) / v.W))); }
function drawBigTo(canvas, v, s, state, now, interactive) {
  const G = geo(v);
  const { g, r } = blit(canvas, v.W, G.H, s, ag => drawLock(ag, v, state, now));
  const b = r.button, size = fitWord(g, 'UNLOCK', (b.w - 4) * s, Math.round(s * 6.5));
  popWord(g, 'UNLOCK', (b.x + b.w / 2) * s, (b.y + b.h / 2 - 1) * s, size, '#ffd166');
  if (interactive) {
    lastHit = r;
    const e = (now - state.popAt) / 1300;
    if (e >= 0 && e < 1) {
      g.save(); g.globalAlpha = e > .7 ? (1 - e) / .3 : 1;
      const sc = e < .15 ? .6 + .4 * Math.sin(e / .15 * Math.PI / 2) * 1.15 : 1;
      g.translate(canvas.width / 2, (G.wy - 6) * s - e * 40); g.scale(sc, sc);
      popWord(g, 'UNLOCK!', 0, 0, fitWord(g, 'UNLOCK!', canvas.width * .95, Math.round(s * 7)), '#7ee08a');
      g.restore();
    }
  }
}
function drawAll(now = performance.now()) {
  const ms = miniSize(cur);
  MS = Math.max(2, Math.round(78 / ms.W));
  blit(mini, ms.W, ms.H, MS, ag => drawMini(ag, cur));
  if (document.getElementById('ov').classList.contains('open')) drawBigTo(big, cur, BS, st, now, true);
}
function buildCompare() {
  const box = document.getElementById('cmp');
  box.innerHTML = '';
  const n = VARIANTS.length, totalW = VARIANTS.reduce((a, v) => a + v.W, 0);
  const maxH = Math.max(...VARIANTS.map(v => geo(v).H));
  const s = Math.max(2, Math.floor(Math.min((innerHeight - 170) / maxH, (innerWidth * .9 - n * 30) / totalW)));
  for (const v of VARIANTS) {
    const f = document.createElement('figure'), c = document.createElement('canvas');
    drawBigTo(c, v, s, { dials: [1, 9, 4, 7], roll: [0, 0, 0, 0], pressAt: -1e9, popAt: -1e9 }, 0, false);
    const cap = document.createElement('figcaption');
    cap.innerHTML = `${v.id} · ${v.name}<small>${v.note}</small>`;
    f.append(c, cap);
    f.onclick = () => { pick(v); openBig(); };
    box.appendChild(f);
  }
}
function loop(now) {
  let moving = false;
  for (let i = 0; i < 4; i++) if (st.roll[i]) { st.roll[i] *= .72; if (Math.abs(st.roll[i]) < .3) st.roll[i] = 0; moving = true; }
  if (moving || now - st.pressAt < 200 || now - st.popAt < 1300) drawAll(now);
  requestAnimationFrame(loop);
}

// ── Controls ──
function pick(v) { cur = v; renderOpts(); drawAll(); }
function showCompare(on) { document.getElementById('cmp').classList.toggle('open', on); if (on) { document.getElementById('ov').classList.remove('open'); buildCompare(); } renderOpts(); hint(); }
function openBig() {
  showCompare(false);
  BS = bigScale(cur);
  document.getElementById('ov').classList.add('open');
  big.style.animation = 'none'; big.offsetHeight; big.style.animation = '';
  drawAll(); hint();
}
function renderOpts() {
  const o = document.getElementById('opts'), cmpOn = document.getElementById('cmp').classList.contains('open');
  o.innerHTML = '';
  const btn = (txt, on, fn) => { const b = document.createElement('button'); b.textContent = txt; if (on) b.className = 'on'; b.onclick = fn; o.appendChild(b); };
  btn('Compare all', cmpOn, () => showCompare(true));
  for (const v of VARIANTS) btn(v.id + ' · ' + v.name, !cmpOn && v === cur, () => { pick(v); showCompare(false); });
  o.appendChild(Object.assign(document.createElement('span'), { className: 'gap' }));
  btn('٠١٢٣', digitSet === 'ar', () => { digitSet = 'ar'; refresh(); });
  btn('0123', digitSet === 'en', () => { digitSet = 'en'; refresh(); });
}
function refresh() { renderOpts(); if (document.getElementById('cmp').classList.contains('open')) buildCompare(); drawAll(); }
function hint() {
  const cmpOn = document.getElementById('cmp').classList.contains('open');
  document.getElementById('hint').textContent = cmpOn ? 'Tap a lock to try it · or pick one above and tap the mini lock in the top-right corner'
    : cur.arrows === 'side' ? 'Tap the mini lock (top-right) · ▲ / ▼ beside a dial, or swipe it · tap outside to close'
    : 'Tap the mini lock (top-right) · tap the top / bottom half of a dial, or swipe it · tap outside to close';
}
function turn(i, dir) { st.dials[i] = (st.dials[i] + dir + 10) % 10; st.roll[i] = dir * (7 + cur.pad + 2) / cur.gs; }
mini.onclick = openBig;
document.getElementById('ov').addEventListener('pointerdown', e => { if (e.target.id === 'ov') e.currentTarget.classList.remove('open'); });
let swipe = null;
big.addEventListener('pointerdown', e => {
  if (!lastHit) return;
  const r = big.getBoundingClientRect(), x = (e.clientX - r.left) / BS, y = (e.clientY - r.top) / BS;
  const b = lastHit.button, G = lastHit.G;
  if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) { st.pressAt = st.popAt = performance.now(); drawAll(); return; }
  const i = Math.floor((y - G.wy) / G.dh);
  if (i < 0 || i > 3) return;
  const mid = G.wy + 1 + i * G.dh + (G.dh - 3) / 2;
  if (cur.arrows === 'side' && x >= G.wx + G.ww + 1 && x <= G.wx + G.ww + 11) { turn(i, y < mid ? -1 : 1); drawAll(); return; }
  if (x >= G.wx && x < G.wx + G.ww) { swipe = { i, y: e.clientY, startY: e.clientY, mid, moved: false }; big.setPointerCapture(e.pointerId); }
});
big.addEventListener('pointermove', e => {
  if (!swipe) return;
  const step = BS * 8;
  while (e.clientY - swipe.y > step) { turn(swipe.i, -1); swipe.y += step; swipe.moved = true; }
  while (swipe.y - e.clientY > step) { turn(swipe.i, 1); swipe.y -= step; swipe.moved = true; }
});
big.addEventListener('pointerup', e => {
  if (swipe && !swipe.moved && cur.arrows === 'carets') {
    const r = big.getBoundingClientRect(), y = (e.clientY - r.top) / BS;
    turn(swipe.i, y < swipe.mid ? -1 : 1); drawAll();
  }
  swipe = null;
});
addEventListener('resize', () => { BS = bigScale(cur); if (document.getElementById('cmp').classList.contains('open')) buildCompare(); drawAll(); });
document.fonts.load("700 20px 'Silkscreen'").then(() => refresh());
const Q = new URLSearchParams(location.search);
if (Q.get('v')) cur = VARIANTS.find(v => v.id === Q.get('v').toUpperCase()) || cur;
renderOpts(); drawAll(); requestAnimationFrame(loop);
if (Q.get('open') === '1') openBig(); else showCompare(true);
</script>
</body>
</html>
